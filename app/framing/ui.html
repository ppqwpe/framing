했습니다.": "Unable to read the image.", "다시 시도": "Retry", "프레임레이트": "Frame rate", "길이": "Duration", "코덱": "Codec", "오디오 코덱": "Audio codec", "파일 크기": "File size", "작업 저장 실패": "Unable to save project", "작업 파일은 2MB까지 열 수 있습니다.": "Project files must be 2MB or smaller.", "작업 열기 실패": "Unable to open project", "미리보기를 만들지 못했습니다.": "Unable to create preview.", "예: final_": "Example: final_", "예: _v02": "Example: _v02", "추가 편집 · 필요할 때 펼치기": "More editing options", "목록 정렬": "Sort list", "선택 목록 제거": "Remove selected", "변경 전 → 변경 후": "Before → After", "이름 미리보기 필터": "Filter rename preview", "전체 보기": "Show all", "확인 필요": "Needs review", "개 선택 파일이 필터로 숨겨져 있습니다. 선택 상태와 변경 대상은 유지됩니다.": " selected files are hidden by the filter. They remain selected for renaming.", "이름을 바꾸지 못했습니다.": "Unable to rename files.", "샷": "Shot", "파일 정보 · 컬러스페이스": "File info · color metadata", "컬러스페이스 · 미지정": "Color metadata · unspecified", "프레임 검사": "Frame inspection", "홀드 최소 길이": "Minimum hold duration", "홀드": "Hold", "완전히 동일한 인접 프레임 구간": "Ranges with identical adjacent frames", "홀드 후보": "Possible holds", "합계": "Total", "전체": "All", "동일 프레임": "Identical frames", "검은 프레임": "Black frames", "누락·기타": "Missing / other", "검사 후보 필터": "Filter review candidates", "확인 →": "Review →", "컬러스페이스 정보": "Color metadata", "파일에 기록된 값": "Values recorded in the file", "색역 / Primaries": "Primaries", "전달 함수 / Transfer": "Transfer function", "매트릭스 / Space": "Matrix / color space", "밝기 범위 / Range": "Luma range", "픽셀 형식": "Pixel format", "\n    어디를 뽑을지만 정하면 됩니다.\n      첫 · 중간 · 마지막 (기본) / 균등하게 N장 / N프레임마다 / 직접 찍기 / 전부\n\n    직접 찍기 (--at, 쉼표로 여러 개)\n      first middle last · 프레임 번호(0부터) · -1(끝에서부터) · 25% · 1:23 · 3s\n      all 이라고 쓰면 전부 — 시퀀스로 풉니다\n\n    몇 장만 뽑을 때는 PNG · JPG(4:4:4) 로, 전부 풀 때는 PNG · JPG · EXR · DPX 로.\n    무손실 시퀀스는 원본 mp4 의 수십~수백 배가 됩니다. 1분 1080p ≈ 5~15GB.\n\n    색이 달라 보이지 않게 하는 일 세 가지는 몇 장이든 전부든 똑같이 합니다.\n      · JPG 는 색을 줄이지 않는 4:4:4 로\n      · 10bit · 알파 소스는 원본 깊이 그대로 (16bit PNG, 알파 유지)\n      · 밝기 범위 표기가 틀린 영상은 읽는 단계에서 바로잡음 (--levels auto|full|keep)\n\n    화면과 여전히 다르면 보는 프로그램의 감마 차이입니다 (영상 2.4 vs sRGB 2.2).\n    그건 파일을 고쳐서 맞추면 안 됩니다 — 다른 모든 도구와 어긋나게 됩니다.": "Choose where to extract frames: first, middle, last, a frame number, a percentage or a timestamp. Use All frames to save every decoded frame as a numbered image sequence. PNG is lossless; JPG is smaller. EXR and DPX are available for full sequences. Source files stay unchanged.", "어디를 뽑을지만 정하면 됩니다.\n      첫 · 중간 · 마지막 (기본) / 균등하게 N장 / N프레임마다 / 직접 찍기 / 전부\n\n    직접 찍기 (--at, 쉼표로 여러 개)\n      first middle last · 프레임 번호(0부터) · -1(끝에서부터) · 25% · 1:23 · 3s\n      all 이라고 쓰면 전부 — 시퀀스로 풉니다\n\n    몇 장만 뽑을 때는 PNG · JPG(4:4:4) 로, 전부 풀 때는 PNG · JPG · EXR · DPX 로.\n    무손실 시퀀스는 원본 mp4 의 수십~수백 배가 됩니다. 1분 1080p ≈ 5~15GB.\n\n    색이 달라 보이지 않게 하는 일 세 가지는 몇 장이든 전부든 똑같이 합니다.\n      · JPG 는 색을 줄이지 않는 4:4:4 로\n      · 10bit · 알파 소스는 원본 깊이 그대로 (16bit PNG, 알파 유지)\n      · 밝기 범위 표기가 틀린 영상은 읽는 단계에서 바로잡음 (--levels auto|full|keep)\n\n    화면과 여전히 다르면 보는 프로그램의 감마 차이입니다 (영상 2.4 vs sRGB 2.2).\n    그건 파일을 고쳐서 맞추면 안 됩니다 — 다른 모든 도구와 어긋나게 됩니다.": "Choose where to extract frames: first, middle, last, a frame number, a percentage or a timestamp. Use All frames to save every decoded frame as a numbered image sequence. PNG is lossless; JPG is smaller. EXR and DPX are available for full sequences. Source files stay unchanged.", "\n    무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n\n    auto 가 소스를 보고 정하는 기준\n      8bit 4:2:0        h264 mp4 (소리도 같이 뒤집습니다)\n      10bit · 4:2:2     ProRes 422 HQ mov — 계조를 안 깎으려고\n      알파가 있으면     ProRes 4444 mov — 투명도를 지키려고\n    무엇이 들어오든 h264 로 내보내면 순서 바꾸려다 원본 계조와 알파를 죽이게 됩니다.\n\n    시퀀스 폴더를 넣고 seq · both 로 받으면 파일을 역순으로 복사만 합니다 —\n    픽셀은 손대지 않습니다.\n\n    소스의 색 규격(bt709 / bt601 · 제한범위 / 전체범위)은 결과에 그대로 찍어 둡니다.\n    안 찍어 두면 다음 도구가 추측하고, 그 추측이 어긋나는 게 색이 밀리는 진짜 원인입니다.\n\n\n    30초가 넘는 영상은 ffmpeg 의 reverse 필터가 전체를 램에 올려서 위험하므로,\n    프레임을 경유하는 방식으로 자동 전환합니다. 이때 소리는 빠집니다.": "Reverse a video or an image sequence. Auto saves a video; Sequence saves numbered frames. Sequence + MP4 saves both. Audio is omitted when processing through intermediate frames. Review the result before using it in an edit.", "무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n\n    auto 가 소스를 보고 정하는 기준\n      8bit 4:2:0        h264 mp4 (소리도 같이 뒤집습니다)\n      10bit · 4:2:2     ProRes 422 HQ mov — 계조를 안 깎으려고\n      알파가 있으면     ProRes 4444 mov — 투명도를 지키려고\n    무엇이 들어오든 h264 로 내보내면 순서 바꾸려다 원본 계조와 알파를 죽이게 됩니다.\n\n    시퀀스 폴더를 넣고 seq · both 로 받으면 파일을 역순으로 복사만 합니다 —\n    픽셀은 손대지 않습니다.\n\n    소스의 색 규격(bt709 / bt601 · 제한범위 / 전체범위)은 결과에 그대로 찍어 둡니다.\n    안 찍어 두면 다음 도구가 추측하고, 그 추측이 어긋나는 게 색이 밀리는 진짜 원인입니다.\n\n\n    30초가 넘는 영상은 ffmpeg 의 reverse 필터가 전체를 램에 올려서 위험하므로,\n    프레임을 경유하는 방식으로 자동 전환합니다. 이때 소리는 빠집니다.": "Reverse a video or an image sequence. Auto saves a video; Sequence saves numbered frames. Sequence + MP4 saves both. Audio is omitted when processing through intermediate frames. Review the result before using it in an edit.", "\n    길이를 말하는 방법이 셋입니다. 편한 걸 쓰세요. 어느 쪽이든 같은 곳으로 갑니다.\n      --frames 264     결과를 264프레임으로\n      --seconds 11     결과를 11초로 (fps 를 곱해서 계산)\n      --speed 0.5      절반 속도 = 두 배 길이. 2 면 두 배 빠르게\n\n    없는 프레임을 무엇으로 채울까  (--retime-mode)\n      auto     소재를 보고 알아서 고릅니다 (기본). 무엇을 골랐는지 매번 알려줍니다\n      dup      가장 가까운 원본 프레임을 그대로. 픽셀 연산이 0 이라 매트가 100% 남습니다\n      motion   움직임을 추정해 없던 그림을 그립니다. 제일 부드럽고, 가끔 찢어집니다\n               (ffmpeg 이 없으면 앞뒤를 섞는 방식으로 알아서 물러섭니다)\n\n    auto 가 고르는 기준\n      매트 · 뎁스 패스면          → dup.    라벨색을 뭉개면 그 픽셀의 뜻이 사라집니다\n      실사인데 느리게 (늘리기)     → motion. 슬로모션은 없던 프레임이 있어야 매끄럽습니다\n      실사인데 빠르게 (줄이기)     → dup.    버리는 작업이라 새로 그릴 게 없습니다\n\n    매트 패스를 알아서 알아봅니다\n      매트는 몇 개의 라벨색으로만 칠해져 색상이 좁게 몰립니다 (실측 83~99%).\n      실사·페인팅은 넓게 퍼집니다 (21~28%). 이 차이로 갈라냅니다.\n      매트로 판별되면 쓰인 라벨색을 찾아 보여주고, 보간 후 섞인 픽셀을\n      가장 가까운 라벨로 되돌립니다. 명도는 손대지 않습니다 — 그건 뎁스니까요.\n      실사인데 매트로 잘못 본 것 같으면 --no-snap 으로 색 복원을 끄세요.\n\n    무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov — 영상 하나만 나옵니다\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n      bundle 영상·전체 프레임·새로 보간된 프레임·기록을 새 폴더에 저장\n    새 UI 리타임 작업은 bundle이 기본입니다. CLI는 auto를 유지합니다.\n\n    알아둘 것\n      · 24fps 의 배수로 맞추면 편집에서 어긋나지 않습니다. 아니면 알려줍니다.\n      · motion 은 결과를 꼭 눈으로 보세요. 빠른 움직임 · 가림 · 모션블러에 약합니다.\n      · 소리는 빠집니다. 길이가 바뀌면 소리도 같이 늘려야 하는데,\n        그건 리타임이 아니라 다른 작업입니다.\n      · --note 를 주면 어디를 손댔는지 메모장(.txt) 한 장을 결과 옆에 놓습니다.\n      · 영상 소스의 색 규격(bt709 / 제한범위 등)은 결과 mp4 에 그대로 찍어 둡니다.": "Change duration or speed while keeping the output FPS. Nearest frame reuses original pixels. Blend mixes neighboring images and may cause ghosting. Motion estimates movement with FFmpeg minterpolate (MCI, bidirectional estimation and adaptive overlapping blocks); it is not a neural AI model. It may distort fast motion, occlusions or scene cuts. Auto chooses nearest frame for mattes or shortening, and motion for slowing live action; without FFmpeg it falls back to blending.\n\nExample: three frames A–B–C retimed to five become A–intermediate–B–intermediate–C. The first and last frames are preserved. Other output positions do not always coincide with an original frame. Mapping marks describe sampling, not detected holds.\n\nChoose Video + frame folders to save the movie, every PNG frame, interpolated PNG frames and a mapping manifest together. Retimed exports do not contain source audio. 16-bit and grayscale inputs use Blend instead of Motion to preserve depth and channel layout; the actual method is recorded in the result.", "길이를 말하는 방법이 셋입니다. 편한 걸 쓰세요. 어느 쪽이든 같은 곳으로 갑니다.\n      --frames 264     결과를 264프레임으로\n      --seconds 11     결과를 11초로 (fps 를 곱해서 계산)\n      --speed 0.5      절반 속도 = 두 배 길이. 2 면 두 배 빠르게\n\n    없는 프레임을 무엇으로 채울까  (--retime-mode)\n      auto     소재를 보고 알아서 고릅니다 (기본). 무엇을 골랐는지 매번 알려줍니다\n      dup      가장 가까운 원본 프레임을 그대로. 픽셀 연산이 0 이라 매트가 100% 남습니다\n      motion   움직임을 추정해 없던 그림을 그립니다. 제일 부드럽고, 가끔 찢어집니다\n               (ffmpeg 이 없으면 앞뒤를 섞는 방식으로 알아서 물러섭니다)\n\n    auto 가 고르는 기준\n      매트 · 뎁스 패스면          → dup.    라벨색을 뭉개면 그 픽셀의 뜻이 사라집니다\n      실사인데 느리게 (늘리기)     → motion. 슬로모션은 없던 프레임이 있어야 매끄럽습니다\n      실사인데 빠르게 (줄이기)     → dup.    버리는 작업이라 새로 그릴 게 없습니다\n\n    매트 패스를 알아서 알아봅니다\n      매트는 몇 개의 라벨색으로만 칠해져 색상이 좁게 몰립니다 (실측 83~99%).\n      실사·페인팅은 넓게 퍼집니다 (21~28%). 이 차이로 갈라냅니다.\n      매트로 판별되면 쓰인 라벨색을 찾아 보여주고, 보간 후 섞인 픽셀을\n      가장 가까운 라벨로 되돌립니다. 명도는 손대지 않습니다 — 그건 뎁스니까요.\n      실사인데 매트로 잘못 본 것 같으면 --no-snap 으로 색 복원을 끄세요.\n\n    무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov — 영상 하나만 나옵니다\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n      bundle 영상·전체 프레임·새로 보간된 프레임·기록을 새 폴더에 저장\n    새 UI 리타임 작업은 bundle이 기본입니다. CLI는 auto를 유지합니다.\n\n    알아둘 것\n      · 24fps 의 배수로 맞추면 편집에서 어긋나지 않습니다. 아니면 알려줍니다.\n      · motion 은 결과를 꼭 눈으로 보세요. 빠른 움직임 · 가림 · 모션블러에 약합니다.\n      · 소리는 빠집니다. 길이가 바뀌면 소리도 같이 늘려야 하는데,\n        그건 리타임이 아니라 다른 작업입니다.\n      · --note 를 주면 어디를 손댔는지 메모장(.txt) 한 장을 결과 옆에 놓습니다.\n      · 영상 소스의 색 규격(bt709 / 제한범위 등)은 결과 mp4 에 그대로 찍어 둡니다.": "Change duration or speed while keeping the output FPS. Nearest frame reuses original pixels. Blend mixes neighboring images and may cause ghosting. Motion estimates movement with FFmpeg minterpolate (MCI, bidirectional estimation and adaptive overlapping blocks); it is not a neural AI model. It may distort fast motion, occlusions or scene cuts. Auto chooses nearest frame for mattes or shortening, and motion for slowing live action; without FFmpeg it falls back to blending.\n\nExample: three frames A–B–C retimed to five become A–intermediate–B–intermediate–C. The first and last frames are preserved. Other output positions do not always coincide with an original frame. Mapping marks describe sampling, not detected holds.\n\nChoose Video + frame folders to save the movie, every PNG frame, interpolated PNG frames and a mapping manifest together. Retimed exports do not contain source audio. 16-bit and grayscale inputs use Blend instead of Motion to preserve depth and channel layout; the actual method is recorded in the result.", "\n    영상 · 이미지 · 번호 붙은 시퀀스 폴더를 다 받습니다.\n    넣은 것과 안 맞는 목적지를 골라 두면 맞는 쪽으로 알아서 옮기고 알려줍니다.\n\n    이미지를 넣으면\n      PNG · JPG · WEBP 로 바꿉니다. --max-height 로 크기도 같이 줄일 수 있습니다.\n      (재보니 같은 그림이 PNG 153KB → JPG 24KB → WEBP 18KB 였습니다.)\n\n    시퀀스 폴더를 넣으면\n      영상 한 편으로 묶습니다. Sequence 의 반대 방향입니다.\n      --prores-movie 를 붙이면 누크용 ProRes 로 묶고, 알파가 있으면 4444 로 갑니다.\n      번호가 1부터 시작하지 않거나 중간이 비어 있어도 됩니다 —\n      패턴을 짜 맞추지 않고 파일 목록을 그대로 먹입니다.\n\n    영상을 넣으면, 어디로 보낼지 하나만 고르면 됩니다.\n\n      MP4 (배포·업로드)\n        가장 잘 열리는 형식입니다. 안에 든 코덱이 mp4 가 받는 것(h264 / hevc /\n        mpeg4 / av1)이면 다시 인코딩하지 않고 상자만 갈아끼웁니다. 몇 초 걸리고\n        화질 손실은 없습니다. 영상 데이터가 비트 단위로 그대로 옮겨갑니다.\n\n      MOV (상자만 교체)\n        확장자만 .mov 가 됩니다. h264 짜리를 .mov 로 바꿔도 안에 든 건 여전히\n        h264 입니다. 화질이 좋아지지도, 편집이 수월해지지도 않습니다.\n        편집용 마스터가 필요하면 아래를 쓰세요.\n\n      누크용 마스터 (ProRes)\n        Nuke · After Effects · Resolve 가 스크러빙할 때 버벅이지 않는 코덱입니다.\n          · 용량이 10~30배 커집니다. 고장이 아니라 원래 그렇습니다.\n          · 스크러빙 속도와 세대 손실 내성을 용량으로 사는 코덱입니다.\n          · 배포·업로드용으로 쓰면 안 됩니다.\n          · h264 를 ProRes 로 바꿔도 없던 화질이 생기지는 않습니다.\n            이미 뭉개진 8bit 계조를 10bit 상자에 옮겨 담을 뿐입니다.\n            다시 인코딩할 거라면 원본 렌더에서 바로 뽑는 게 맞습니다.\n          · 알파가 있으면 알아서 ProRes 4444 로 갑니다. 422 HQ 는 알파를 못 담습니다.\n\n      용량 줄이기\n        반드시 다시 인코딩합니다. 되돌릴 수 없는 화질 손실이 생깁니다.\n        원본은 그대로 두고 새 파일을 만드니, 마음에 안 들면 지우면 됩니다.\n        이미 잘 압축된 파일은 오히려 커질 수 있습니다. 그러면 커졌다고 알려줍니다.\n\n        가장 크게 줄이는 건 화질 단계가 아니라 해상도입니다. 4K → 1080p 면\n        픽셀 수가 1/4 이 됩니다. 화질을 만지기 전에 \"이걸 정말 4K 로 봐야 하나\"를\n        먼저 따져보세요.\n\n        h265 는 같은 화질에 20~30% 더 작지만 인코딩이 2~4배 느리고,\n        옛 기기나 일부 편집 프로그램에서 안 열립니다.\n\n    공통\n      · 알파 채널은 mp4 에 못 들어갑니다. 투명도가 필요하면 누크용 마스터나\n        PNG 시퀀스를 쓰세요.\n      · 소스의 색 규격(bt709 / 제한범위 등)을 결과에 그대로 적어 둡니다.\n        안 적어 두면 다음 도구가 추측하고, 그 추측이 어긋나면 색이 밀립니다.\n      · 10bit · 4:2:2 소스는 배포용으로 갈 때 8bit 로 내려갑니다. 내려간다고\n        알려줍니다. 계조를 지키려면 누크용 마스터로 가세요.\n": "Image sequence → video: put numbered images in one folder (for example shot_0001.png, shot_0002.png), add that folder, choose Sequence → video, set Sequence FPS and run. Images are naturally sorted by filename. At 24 FPS, 240 images make 10 seconds. The images must have matching dimensions, channels and bit depth. This plays existing images in order; it does not invent movement from a single photograph.\n\nChoose GIF for an animated preview with FPS, width and loop controls. Video → image sequence saves every decoded frame in a new folder. MP4 is for sharing; ProRes is for editing and alpha. MOV can repackage compatible streams without re-encoding. Compression re-encodes and can lose quality.", "영상 · 이미지 · 번호 붙은 시퀀스 폴더를 다 받습니다.\n    넣은 것과 안 맞는 목적지를 골라 두면 맞는 쪽으로 알아서 옮기고 알려줍니다.\n\n    이미지를 넣으면\n      PNG · JPG · WEBP 로 바꿉니다. --max-height 로 크기도 같이 줄일 수 있습니다.\n      (재보니 같은 그림이 PNG 153KB → JPG 24KB → WEBP 18KB 였습니다.)\n\n    시퀀스 폴더를 넣으면\n      영상 한 편으로 묶습니다. Sequence 의 반대 방향입니다.\n      --prores-movie 를 붙이면 누크용 ProRes 로 묶고, 알파가 있으면 4444 로 갑니다.\n      번호가 1부터 시작하지 않거나 중간이 비어 있어도 됩니다 —\n      패턴을 짜 맞추지 않고 파일 목록을 그대로 먹입니다.\n\n    영상을 넣으면, 어디로 보낼지 하나만 고르면 됩니다.\n\n      MP4 (배포·업로드)\n        가장 잘 열리는 형식입니다. 안에 든 코덱이 mp4 가 받는 것(h264 / hevc /\n        mpeg4 / av1)이면 다시 인코딩하지 않고 상자만 갈아끼웁니다. 몇 초 걸리고\n        화질 손실은 없습니다. 영상 데이터가 비트 단위로 그대로 옮겨갑니다.\n\n      MOV (상자만 교체)\n        확장자만 .mov 가 됩니다. h264 짜리를 .mov 로 바꿔도 안에 든 건 여전히\n        h264 입니다. 화질이 좋아지지도, 편집이 수월해지지도 않습니다.\n        편집용 마스터가 필요하면 아래를 쓰세요.\n\n      누크용 마스터 (ProRes)\n        Nuke · After Effects · Resolve 가 스크러빙할 때 버벅이지 않는 코덱입니다.\n          · 용량이 10~30배 커집니다. 고장이 아니라 원래 그렇습니다.\n          · 스크러빙 속도와 세대 손실 내성을 용량으로 사는 코덱입니다.\n          · 배포·업로드용으로 쓰면 안 됩니다.\n          · h264 를 ProRes 로 바꿔도 없던 화질이 생기지는 않습니다.\n            이미 뭉개진 8bit 계조를 10bit 상자에 옮겨 담을 뿐입니다.\n            다시 인코딩할 거라면 원본 렌더에서 바로 뽑는 게 맞습니다.\n          · 알파가 있으면 알아서 ProRes 4444 로 갑니다. 422 HQ 는 알파를 못 담습니다.\n\n      용량 줄이기\n        반드시 다시 인코딩합니다. 되돌릴 수 없는 화질 손실이 생깁니다.\n        원본은 그대로 두고 새 파일을 만드니, 마음에 안 들면 지우면 됩니다.\n        이미 잘 압축된 파일은 오히려 커질 수 있습니다. 그러면 커졌다고 알려줍니다.\n\n        가장 크게 줄이는 건 화질 단계가 아니라 해상도입니다. 4K → 1080p 면\n        픽셀 수가 1/4 이 됩니다. 화질을 만지기 전에 \"이걸 정말 4K 로 봐야 하나\"를\n        먼저 따져보세요.\n\n        h265 는 같은 화질에 20~30% 더 작지만 인코딩이 2~4배 느리고,\n        옛 기기나 일부 편집 프로그램에서 안 열립니다.\n\n    공통\n      · 알파 채널은 mp4 에 못 들어갑니다. 투명도가 필요하면 누크용 마스터나\n        PNG 시퀀스를 쓰세요.\n      · 소스의 색 규격(bt709 / 제한범위 등)을 결과에 그대로 적어 둡니다.\n        안 적어 두면 다음 도구가 추측하고, 그 추측이 어긋나면 색이 밀립니다.\n      · 10bit · 4:2:2 소스는 배포용으로 갈 때 8bit 로 내려갑니다. 내려간다고\n        알려줍니다. 계조를 지키려면 누크용 마스터로 가세요.": "Image sequence → video: put numbered images in one folder (for example shot_0001.png, shot_0002.png), add that folder, choose Sequence → video, set Sequence FPS and run. Images are naturally sorted by filename. At 24 FPS, 240 images make 10 seconds. The images must have matching dimensions, channels and bit depth. This plays existing images in order; it does not invent movement from a single photograph.\n\nChoose GIF for an animated preview with FPS, width and loop controls. Video → image sequence saves every decoded frame in a new folder. MP4 is for sharing; ProRes is for editing and alpha. MOV can repackage compatible streams without re-encoding. Compression re-encodes and can lose quality.", "\n    파일 두 개를 넣으세요. 먼저 넣은 것이 A, 나중이 B 입니다.\n    (폴더를 넣으면 그 안의 앞의 두 개를 씁니다.)\n\n    실행하면 대조 창이 바로 열립니다. 인코딩을 기다릴 것도, 파일이 쌓일 것도 없습니다.\n\n    창 안에서 네 가지를 오갈 수 있습니다  (숫자키 1~4)\n      1 반반 바   경계선을 잡고 좌우로 끌면 A 와 B 가 갈립니다\n      2 겹치기    포개서 봅니다. 섞기 손잡이로 0~100% 조절 — 위치가 밀렸는지 볼 때\n      3 번갈아    빠르게 교대합니다. 미세한 차이는 이게 제일 잘 보입니다\n      4 나란히    왼쪽 A, 오른쪽 B. 여기 안에 \"둘 다 · A만 · B만\" 이 같이 있습니다\n\n      바 끌기 · ← → 로 미세 조정 (Shift 를 누르면 더 잘게)\n      A · B 키로 한쪽만 · Space 재생·멈춤\n      영상이면 두 쪽이 같은 지점을 보도록 재생 위치를 계속 맞춰 둡니다.\n\n    --view 로 어느 보기로 열지 정합니다 (wipe · overlay · flicker · side).\n\n    남는 것 없이 봅니다\n      대조는 결과물이 아니라 확인하는 행위입니다. 볼 때마다 원본 폴더에 파일이 쌓이면\n      정작 필요한 파일이 묻힙니다. 그래서 임시 자리에 만들고, Framing 을 닫을 때 지웁니다.\n      남겨서 남에게 보내야 하면 --keep 을 붙이세요. 그때는 원본 옆에 폴더를 만들고\n      고른 보기로 구운 대조 영상도 같이 넣어 줍니다.\n\n    브라우저가 못 여는 형식이면 알아서 바꿔 놓고 봅니다\n      창의 재생기가 실제로 여는 건 mp4(h264 8bit) 와 webm 정도입니다.\n      ProRes · DNxHD · HEVC · 10bit · .mov 상자는 아무 말 없이 까만 화면만 나옵니다.\n      그래서 미리 알아보고, 못 여는 형식이면 볼 수 있는 한 벌을 만들어 그걸 겁니다.\n      창 위쪽에 \"보기용으로 변환함\" 이라고 붙습니다 — 원본 픽셀이 아니라는 뜻입니다.\n      원본은 손대지 않고, --keep 으로 굽는 대조 영상도 원본에서 만듭니다.\n      1440p 가 넘으면 보기용만 그 크기로 줄입니다. 줄였다고 알려줍니다.\n\n    알아둘 것\n      · 해상도가 다르면 A 기준 캔버스에 비율을 유지해 맞추고 검은 여백을 넣습니다.\n      · 길이가 다르면 짧은 쪽에서 끝납니다.\n      · 색 규격이 서로 다르면 그것부터 알려줍니다. 그게 차이의 원인일 때가 많습니다.": "Add two videos or two images as A and B. Use Wipe, Overlay, Flicker or Side by side, or view one input. The timeline controls both inputs; comparison ends at the shorter duration. B is fitted to the A canvas with its aspect ratio preserved.\n\nSelect a region by dragging or by entering pixel coordinates. Region only zooms the comparison to that crop. Export the current PNG, full video, full PNG sequence or both video and frames. Export the current view or all views including A/B. Exports render from the source and omit the viewer guides, zoom and pan.", "파일 두 개를 넣으세요. 먼저 넣은 것이 A, 나중이 B 입니다.\n    (폴더를 넣으면 그 안의 앞의 두 개를 씁니다.)\n\n    실행하면 대조 창이 바로 열립니다. 인코딩을 기다릴 것도, 파일이 쌓일 것도 없습니다.\n\n    창 안에서 네 가지를 오갈 수 있습니다  (숫자키 1~4)\n      1 반반 바   경계선을 잡고 좌우로 끌면 A 와 B 가 갈립니다\n      2 겹치기    포개서 봅니다. 섞기 손잡이로 0~100% 조절 — 위치가 밀렸는지 볼 때\n      3 번갈아    빠르게 교대합니다. 미세한 차이는 이게 제일 잘 보입니다\n      4 나란히    왼쪽 A, 오른쪽 B. 여기 안에 \"둘 다 · A만 · B만\" 이 같이 있습니다\n\n      바 끌기 · ← → 로 미세 조정 (Shift 를 누르면 더 잘게)\n      A · B 키로 한쪽만 · Space 재생·멈춤\n      영상이면 두 쪽이 같은 지점을 보도록 재생 위치를 계속 맞춰 둡니다.\n\n    --view 로 어느 보기로 열지 정합니다 (wipe · overlay · flicker · side).\n\n    남는 것 없이 봅니다\n      대조는 결과물이 아니라 확인하는 행위입니다. 볼 때마다 원본 폴더에 파일이 쌓이면\n      정작 필요한 파일이 묻힙니다. 그래서 임시 자리에 만들고, Framing 을 닫을 때 지웁니다.\n      남겨서 남에게 보내야 하면 --keep 을 붙이세요. 그때는 원본 옆에 폴더를 만들고\n      고른 보기로 구운 대조 영상도 같이 넣어 줍니다.\n\n    브라우저가 못 여는 형식이면 알아서 바꿔 놓고 봅니다\n      창의 재생기가 실제로 여는 건 mp4(h264 8bit) 와 webm 정도입니다.\n      ProRes · DNxHD · HEVC · 10bit · .mov 상자는 아무 말 없이 까만 화면만 나옵니다.\n      그래서 미리 알아보고, 못 여는 형식이면 볼 수 있는 한 벌을 만들어 그걸 겁니다.\n      창 위쪽에 \"보기용으로 변환함\" 이라고 붙습니다 — 원본 픽셀이 아니라는 뜻입니다.\n      원본은 손대지 않고, --keep 으로 굽는 대조 영상도 원본에서 만듭니다.\n      1440p 가 넘으면 보기용만 그 크기로 줄입니다. 줄였다고 알려줍니다.\n\n    알아둘 것\n      · 해상도가 다르면 A 기준 캔버스에 비율을 유지해 맞추고 검은 여백을 넣습니다.\n      · 길이가 다르면 짧은 쪽에서 끝납니다.\n      · 색 규격이 서로 다르면 그것부터 알려줍니다. 그게 차이의 원인일 때가 많습니다.": "Add two videos or two images as A and B. Use Wipe, Overlay, Flicker or Side by side, or view one input. The timeline controls both inputs; comparison ends at the shorter duration. B is fitted to the A canvas with its aspect ratio preserved.\n\nSelect a region by dragging or by entering pixel coordinates. Region only zooms the comparison to that crop. Export the current PNG, full video, full PNG sequence or both video and frames. Export the current view or all views including A/B. Exports render from the source and omit the viewer guides, zoom and pan.", "영역 선택": "Select region", "영역만 보기": "Region only", "영역 해제": "Clear region", "화면 맞춤": "Fit to window", "경계": "Divider", "대조 경계": "Comparison divider", "중앙": "Center", "섞기": "Blend", "B 혼합 비율": "B blend amount", "A 기준 픽셀 · 화면에서 끌어 선택": "Pixels on the A canvas · drag to select", "너비": "Width", "높이": "Height", "대조 화면": "Comparison viewer", "재생 · 멈춤 (Space)": "Play / pause (Space)", "이전 프레임": "Previous frame", "다음 프레임": "Next frame", "재생 위치": "Playback position", "바를 끌거나 ": "Drag the divider or use ", " 로 경계를 옮깁니다 (": " to move it (", " 로 미세 조정)": " for fine steps)", " 재생 · 멈춤": " play / pause", " 보기 · ": " views · ", " 한쪽만 · ": " one input · ", " 맞바꾸기": " swap", "휠 확대 · 오른쪽 끌어 이동 · ": "Wheel to zoom · right-drag to pan · ", " 한 프레임씩 · ": " frame step · ", " 닫기": " close", "프레임을 아직 읽는 중입니다. 잠시 후 다시 저장하세요.": "The frame is still loading. Wait a moment and export again.", "{0} — 대상 {1}개": "{0} — {1} inputs", "{0} — 대상 {1}쌍": "{0} — {1} pairs", "중단됨 — 끝난 것 {0}개 / 실패 {1}개": "Stopped — {0} completed / {1} failed", "보간은 어떻게 하나요?": "How does interpolation work?", "시퀀스를 영상으로 만드는 방법": "How to turn a sequence into a video", "번호 순서의 이미지를 한 폴더에 넣고 그 폴더를 추가하세요. FPS는 1초에 재생할 이미지 수입니다. 240장 ÷ 24 FPS = 10초입니다.": "Put numbered images in one folder and add that folder. FPS is the number of images played each second. 240 images ÷ 24 FPS = 10 seconds.", "사진 한 장에 움직임을 만드는 기능이 아니라, 준비한 이미지들을 순서대로 묶는 기능입니다.": "This plays your existing images in order; it does not create motion from a single photo.", "모션은 FFmpeg로 앞뒤 프레임의 움직임을 추정해 중간 이미지를 만듭니다. 복제는 원본을 다시 쓰고, 겹치기는 앞뒤 이미지를 섞습니다.": "Motion uses FFmpeg to estimate movement between neighboring frames and create intermediate images. Nearest frame reuses originals; Blend mixes neighboring images.", "예: A → B → C를 5장으로 늘리면 A → 중간 → B → 중간 → C. 빠른 움직임·가려지는 물체·컷 경계에서는 결과를 확인하세요. 오디오는 저장하지 않습니다.": "Example: expanding A → B → C to five frames gives A → intermediate → B → intermediate → C. Review fast motion, occlusions and scene cuts. Audio is not exported.", "    무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n\n    auto 가 소스를 보고 정하는 기준\n      8bit 4:2:0        h264 mp4 (소리도 같이 뒤집습니다)\n      10bit · 4:2:2     ProRes 422 HQ mov — 계조를 안 깎으려고\n      알파가 있으면     ProRes 4444 mov — 투명도를 지키려고\n    무엇이 들어오든 h264 로 내보내면 순서 바꾸려다 원본 계조와 알파를 죽이게 됩니다.\n\n    시퀀스 폴더를 넣고 seq · both 로 받으면 파일을 역순으로 복사만 합니다 —\n    픽셀은 손대지 않습니다.\n\n    소스의 색 규격(bt709 / bt601 · 제한범위 / 전체범위)은 결과에 그대로 찍어 둡니다.\n    안 찍어 두면 다음 도구가 추측하고, 그 추측이 어긋나는 게 색이 밀리는 진짜 원인입니다.\n\n\n    30초가 넘는 영상은 ffmpeg 의 reverse 필터가 전체를 램에 올려서 위험하므로,\n    프레임을 경유하는 방식으로 자동 전환합니다. 이때 소리는 빠집니다.": "Reverse a video or an image sequence. Auto saves a video; Sequence saves numbered frames. Sequence + MP4 saves both. Audio is omitted when processing through intermediate frames. Review the result before using it in an edit.", "    길이를 말하는 방법이 셋입니다. 편한 걸 쓰세요. 어느 쪽이든 같은 곳으로 갑니다.\n      --frames 264     결과를 264프레임으로\n      --seconds 11     결과를 11초로 (fps 를 곱해서 계산)\n      --speed 0.5      절반 속도 = 두 배 길이. 2 면 두 배 빠르게\n\n    없는 프레임을 무엇으로 채울까  (--retime-mode)\n      auto     소재를 보고 알아서 고릅니다 (기본). 무엇을 골랐는지 매번 알려줍니다\n      dup      가장 가까운 원본 프레임을 그대로. 픽셀 연산이 0 이라 매트가 100% 남습니다\n      motion   움직임을 추정해 없던 그림을 그립니다. 제일 부드럽고, 가끔 찢어집니다\n               (ffmpeg 이 없으면 앞뒤를 섞는 방식으로 알아서 물러섭니다)\n\n    auto 가 고르는 기준\n      매트 · 뎁스 패스면          → dup.    라벨색을 뭉개면 그 픽셀의 뜻이 사라집니다\n      실사인데 느리게 (늘리기)     → motion. 슬로모션은 없던 프레임이 있어야 매끄럽습니다\n      실사인데 빠르게 (줄이기)     → dup.    버리는 작업이라 새로 그릴 게 없습니다\n\n    매트 패스를 알아서 알아봅니다\n      매트는 몇 개의 라벨색으로만 칠해져 색상이 좁게 몰립니다 (실측 83~99%).\n      실사·페인팅은 넓게 퍼집니다 (21~28%). 이 차이로 갈라냅니다.\n      매트로 판별되면 쓰인 라벨색을 찾아 보여주고, 보간 후 섞인 픽셀을\n      가장 가까운 라벨로 되돌립니다. 명도는 손대지 않습니다 — 그건 뎁스니까요.\n      실사인데 매트로 잘못 본 것 같으면 --no-snap 으로 색 복원을 끄세요.\n\n    무엇으로 받을지 고를 수 있습니다  (--result)\n      auto   알아서 (기본). 8bit 는 mp4, 10bit·알파는 ProRes mov — 영상 하나만 나옵니다\n      mp4    어디서나 열리는 h264 하나\n      mov    누크용 ProRes 마스터 — 계조와 알파를 지킵니다\n      seq    PNG 시퀀스만. 영상은 만들지 않습니다\n      both   시퀀스 + 확인용 영상 둘 다\n      bundle 영상·전체 프레임·새로 보간된 프레임·기록을 새 폴더에 저장\n    새 UI 리타임 작업은 bundle이 기본입니다. CLI는 auto를 유지합니다.\n\n    알아둘 것\n      · 24fps 의 배수로 맞추면 편집에서 어긋나지 않습니다. 아니면 알려줍니다.\n      · motion 은 결과를 꼭 눈으로 보세요. 빠른 움직임 · 가림 · 모션블러에 약합니다.\n      · 소리는 빠집니다. 길이가 바뀌면 소리도 같이 늘려야 하는데,\n        그건 리타임이 아니라 다른 작업입니다.\n      · --note 를 주면 어디를 손댔는지 메모장(.txt) 한 장을 결과 옆에 놓습니다.\n      · 영상 소스의 색 규격(bt709 / 제한범위 등)은 결과 mp4 에 그대로 찍어 둡니다.": "Change duration or speed while keeping the output FPS. Nearest frame reuses original pixels. Blend mixes neighboring images and may cause ghosting. Motion estimates movement with FFmpeg minterpolate (MCI, bidirectional estimation and adaptive overlapping blocks); it is not a neural AI model. It may distort fast motion, occlusions or scene cuts. Auto chooses nearest frame for mattes or shortening, and motion for slowing live action; without FFmpeg it falls back to blending.\n\nExample: three frames A–B–C retimed to five become A–intermediate–B–intermediate–C. The first and last frames are preserved. Other output positions do not always coincide with an original frame. Mapping marks describe sampling, not detected holds.\n\nChoose Video + frame folders to save the movie, every PNG frame, interpolated PNG frames and a mapping manifest together. Retimed exports do not contain source audio. 16-bit and grayscale inputs use Blend instead of Motion to preserve depth and channel layout; the actual method is recorded in the result.", "    영상 · 이미지 · 번호 붙은 시퀀스 폴더를 다 받습니다.\n    넣은 것과 안 맞는 목적지를 골라 두면 맞는 쪽으로 알아서 옮기고 알려줍니다.\n\n    이미지를 넣으면\n      PNG · JPG · WEBP 로 바꿉니다. --max-height 로 크기도 같이 줄일 수 있습니다.\n      (재보니 같은 그림이 PNG 153KB → JPG 24KB → WEBP 18KB 였습니다.)\n\n    시퀀스 폴더를 넣으면\n      영상 한 편으로 묶습니다. Sequence 의 반대 방향입니다.\n      --prores-movie 를 붙이면 누크용 ProRes 로 묶고, 알파가 있으면 4444 로 갑니다.\n      번호가 1부터 시작하지 않거나 중간이 비어 있어도 됩니다 —\n      패턴을 짜 맞추지 않고 파일 목록을 그대로 먹입니다.\n\n    영상을 넣으면, 어디로 보낼지 하나만 고르면 됩니다.\n\n      MP4 (배포·업로드)\n        가장 잘 열리는 형식입니다. 안에 든 코덱이 mp4 가 받는 것(h264 / hevc /\n        mpeg4 / av1)이면 다시 인코딩하지 않고 상자만 갈아끼웁니다. 몇 초 걸리고\n        화질 손실은 없습니다. 영상 데이터가 비트 단위로 그대로 옮겨갑니다.\n\n      MOV (상자만 교체)\n        확장자만 .mov 가 됩니다. h264 짜리를 .mov 로 바꿔도 안에 든 건 여전히\n        h264 입니다. 화질이 좋아지지도, 편집이 수월해지지도 않습니다.\n        편집용 마스터가 필요하면 아래를 쓰세요.\n\n      누크용 마스터 (ProRes)\n        Nuke · After Effects · Resolve 가 스크러빙할 때 버벅이지 않는 코덱입니다.\n          · 용량이 10~30배 커집니다. 고장이 아니라 원래 그렇습니다.\n          · 스크러빙 속도와 세대 손실 내성을 용량으로 사는 코덱입니다.\n          · 배포·업로드용으로 쓰면 안 됩니다.\n          · h264 를 ProRes 로 바꿔도 없던 화질이 생기지는 않습니다.\n            이미 뭉개진 8bit 계조를 10bit 상자에 옮겨 담을 뿐입니다.\n            다시 인코딩할 거라면 원본 렌더에서 바로 뽑는 게 맞습니다.\n          · 알파가 있으면 알아서 ProRes 4444 로 갑니다. 422 HQ 는 알파를 못 담습니다.\n\n      용량 줄이기\n        반드시 다시 인코딩합니다. 되돌릴 수 없는 화질 손실이 생깁니다.\n        원본은 그대로 두고 새 파일을 만드니, 마음에 안 들면 지우면 됩니다.\n        이미 잘 압축된 파일은 오히려 커질 수 있습니다. 그러면 커졌다고 알려줍니다.\n\n        가장 크게 줄이는 건 화질 단계가 아니라 해상도입니다. 4K → 1080p 면\n        픽셀 수가 1/4 이 됩니다. 화질을 만지기 전에 \"이걸 정말 4K 로 봐야 하나\"를\n        먼저 따져보세요.\n\n        h265 는 같은 화질에 20~30% 더 작지만 인코딩이 2~4배 느리고,\n        옛 기기나 일부 편집 프로그램에서 안 열립니다.\n\n    공통\n      · 알파 채널은 mp4 에 못 들어갑니다. 투명도가 필요하면 누크용 마스터나\n        PNG 시퀀스를 쓰세요.\n      · 소스의 색 규격(bt709 / 제한범위 등)을 결과에 그대로 적어 둡니다.\n        안 적어 두면 다음 도구가 추측하고, 그 추측이 어긋나면 색이 밀립니다.\n      · 10bit · 4:2:2 소스는 배포용으로 갈 때 8bit 로 내려갑니다. 내려간다고\n        알려줍니다. 계조를 지키려면 누크용 마스터로 가세요.": "Image sequence → video: put numbered images in one folder (for example shot_0001.png, shot_0002.png), add that folder, choose Sequence → video, set Sequence FPS and run. Images are naturally sorted by filename. At 24 FPS, 240 images make 10 seconds. The images must have matching dimensions, channels and bit depth. This plays existing images in order; it does not invent movement from a single photograph.\n\nChoose GIF for an animated preview with FPS, width and loop controls. Video → image sequence saves every decoded frame in a new folder. MP4 is for sharing; ProRes is for editing and alpha. MOV can repackage compatible streams without re-encoding. Compression re-encodes and can lose quality.", "    파일 두 개를 넣으세요. 먼저 넣은 것이 A, 나중이 B 입니다.\n    (폴더를 넣으면 그 안의 앞의 두 개를 씁니다.)\n\n    실행하면 대조 창이 바로 열립니다. 인코딩을 기다릴 것도, 파일이 쌓일 것도 없습니다.\n\n    창 안에서 네 가지를 오갈 수 있습니다  (숫자키 1~4)\n      1 반반 바   경계선을 잡고 좌우로 끌면 A 와 B 가 갈립니다\n      2 겹치기    포개서 봅니다. 섞기 손잡이로 0~100% 조절 — 위치가 밀렸는지 볼 때\n      3 번갈아    빠르게 교대합니다. 미세한 차이는 이게 제일 잘 보입니다\n      4 나란히    왼쪽 A, 오른쪽 B. 여기 안에 \"둘 다 · A만 · B만\" 이 같이 있습니다\n\n      바 끌기 · ← → 로 미세 조정 (Shift 를 누르면 더 잘게)\n      A · B 키로 한쪽만 · Space 재생·멈춤\n      영상이면 두 쪽이 같은 지점을 보도록 재생 위치를 계속 맞춰 둡니다.\n\n    --view 로 어느 보기로 열지 정합니다 (wipe · overlay · flicker · side).\n\n    남는 것 없이 봅니다\n      대조는 결과물이 아니라 확인하는 행위입니다. 볼 때마다 원본 폴더에 파일이 쌓이면\n      정작 필요한 파일이 묻힙니다. 그래서 임시 자리에 만들고, Framing 을 닫을 때 지웁니다.\n      남겨서 남에게 보내야 하면 --keep 을 붙이세요. 그때는 원본 옆에 폴더를 만들고\n      고른 보기로 구운 대조 영상도 같이 넣어 줍니다.\n\n    브라우저가 못 여는 형식이면 알아서 바꿔 놓고 봅니다\n      창의 재생기가 실제로 여는 건 mp4(h264 8bit) 와 webm 정도입니다.\n      ProRes · DNxHD · HEVC · 10bit · .mov 상자는 아무 말 없이 까만 화면만 나옵니다.\n      그래서 미리 알아보고, 못 여는 형식이면 볼 수 있는 한 벌을 만들어 그걸 겁니다.\n      창 위쪽에 \"보기용으로 변환함\" 이라고 붙습니다 — 원본 픽셀이 아니라는 뜻입니다.\n      원본은 손대지 않고, --keep 으로 굽는 대조 영상도 원본에서 만듭니다.\n      1440p 가 넘으면 보기용만 그 크기로 줄입니다. 줄였다고 알려줍니다.\n\n    알아둘 것\n      · 해상도가 다르면 A 기준 캔버스에 비율을 유지해 맞추고 검은 여백을 넣습니다.\n      · 길이가 다르면 짧은 쪽에서 끝납니다.\n      · 색 규격이 서로 다르면 그것부터 알려줍니다. 그게 차이의 원인일 때가 많습니다.": "Add two videos or two images as A and B. Use Wipe, Overlay, Flicker or Side by side, or view one input. The timeline controls both inputs; comparison ends at the shorter duration. B is fitted to the A canvas with its aspect ratio preserved.\n\nSelect a region by dragging or by entering pixel coordinates. Region only zooms the comparison to that crop. Export the current PNG, full video, full PNG sequence or both video and frames. Export the current view or all views including A/B. Exports render from the source and omit the viewer guides, zoom and pan.", "    AI 영상 이름은 dreamina-2026…-n2vns 처럼 사람이 못 읽습니다. 여기서 정리하세요.\n\n      패턴    장면_{n}  →  장면_01.mp4, 장면_02.mp4 …  ({n} 자리에 번호)\n      도커식  조용한_수달.mp4 처럼 기억하기 쉬운 두 단어를 무작위로\n\n    실행하기 전에 무엇이 무엇으로 바뀌는지 전부 보여주고,\n    하나라도 부딪히면 아무것도 바꾸지 않습니다. 넣은 순서대로 번호가 붙습니다.": "\n    Clean up long, generated filenames before sharing.\n\n      Pattern: shot_{n} → shot_01.mp4, shot_02.mp4 … ({n} is the number)\n      Random words: a memorable two-word name.\n\n    Preview every change before applying it. If any name conflicts, nothing is renamed.\n    Numbers follow the order in the list.", "전체 보기로": "Full view", "왼쪽 {0} {1}% · 오른쪽 {2}": "Left {0} {1}% · right {2}", "왼쪽 {0} | 오른쪽 {1}": "Left {0} | right {1}", "재생하지 못했습니다. 파일 형식을 확인하세요.": "Playback failed. Check the file format.", "── 화면 ──": "── Interface ──", "── 넣은 파일 ──": "── Inputs ──", "── 마지막 기록 ──": "── Recent log ──", "── 오류 ──": "── Errors ──", "말": "Language", "주소": "URL", "고른 것 없음": "Nothing selected", "고른 것": "Selection", "도는 중": "Running", "아니오": "No", "물어보지 못했습니다 — {0}": "Unable to query the backend — {0}", "{0}() 을 창이 내주지 않습니다 (pywebview 판이 낮을 수 있습니다)": "{0}() is unavailable in this window (pywebview may be outdated)", "예시": "Example", "모션 보간은 8비트 컬러 입력을 지원합니다. 계조와 채널을 유지하려면 겹치기를 사용하세요.": "Motion interpolation supports 8-bit color inputs. Use Blend to preserve bit depth and channel layout.", "계조와 채널을 유지하기 위해 모션 보간 대신 겹치기를 사용합니다. 16비트·그레이스케일 입력은 프레임을 혼합합니다.": "Using Blend instead of Motion to preserve bit depth and channel layout. 16-bit and grayscale inputs use frame blending.", "예시 · 원본 3프레임": "Example · 3 source frames", "예시 · 결과 5프레임": "Example · 5 output frames", "Framing 진단서": "Framing diagnostic report", "       (▉ {0} · ░ {1})": "       (▉ {0} · ░ {1})", "      {0}   (▉ {1} · ░ {2})": "{0}   (▉ {1} · ░ {2})", "{0} → {1}프레임  ·  {2}배속  ·  {3}  ·  {4}": "{0} → {1} frames · {2}× speed · {3} · {4}", "플레이트 늘리기 (RIFE)": "Stretch plate (RIFE)", "원본 계조를 지키면서 사이만 RIFE 로 채움": "Keeps the source depth and lets RIFE fill only the gaps", "    두 번에 나눠 돌립니다.\n      framing plate 컷.mov --frames 96        내보내기 (폴더가 생깁니다)\n      framing plate 컷.mov_rife               가져오기 (RIFE 결과를 넣고 다시)\n\n    RIFE 실행 파일을 --rife 로 주면 가운데 단계까지 한 번에 갑니다.\n    정수배(2·4·8)로 뽑은 뒤 목표 장수만 골라냅니다 — 그래야 원본이 격자 위에\n    정확히 놓여서 그대로 통과합니다. 임의 비율로 한 번에 늘리면 원본이 거의\n    안 남습니다. 알파는 다루지 않습니다.": "    Runs in two passes.\n      framing plate shot.mov --frames 96      export (a folder appears)\n      framing plate shot.mov_rife             import (put RIFE output back, run again)\n\n    Pass --rife with the RIFE executable to do the middle step too.\n    It renders an integer multiple (2·4·8) and then selects the target count, so\n    original frames land exactly on the grid and pass through untouched. Stretching\n    straight to an arbitrary ratio leaves almost no originals. Alpha is not handled.", "플레이트  {0}프레임 · {1}fps · {2} · {3}": "Plate  {0} frames · {1}fps · {2} · {3}", "모음  원본 그대로 {0}장 · RIFE 로 채운 자리 {1}장": "Assembled  {0} frames straight from the plate · {1} filled by RIFE", "되묶기  {0} · 색 표기 그대로": "Re-wrapped  {0} · colour tags carried over", "RIFE 실행 파일이 등록되지 않았습니다 — 아래 명령을 직접 돌리세요": "No RIFE executable registered — run this command yourself", "RIFE  {0}배로 돌립니다": "RIFE  running at {0}x", "가져오지 못했습니다 — 위 내용을 확인하세요.": "Nothing was imported — see the lines above.", "플레이트가 두 장은 되어야 사이를 채울 수 있습니다.": "A plate needs at least two frames before anything can be filled in.", "몇 장으로 늘릴지 정해 주세요 (--frames · --seconds · --speed).": "Say how many frames you want (--frames · --seconds · --speed).", "알파는 다루지 않습니다": "Alpha is not handled", "늘린 것 되돌리기": "Undo a stretch", "늘림 메모를 보고 보간 프레임만 빼냄": "Reads the stretch note and removes only the interpolated frames", "메모  {0} · {1}": "Note  {0} · {1}", "{0} → {1}프레임 · 늘린 자리 {2}장 · 되돌리면 {3}장": "{0} → {1} frames · {2} added · reverts to {3}", "늘림 메모를 찾지 못했습니다. {0} 를 영상 옆에 두거나 --note 로 경로를 주세요.": "No stretch note found. Put {0} beside the movie or pass --note.", "되돌릴 수 없습니다 — {0}": "Cannot revert — {0}", "메모에 원본 자리가 하나도 없습니다": "The note lists no original frames", "끝 프레임 붙잡기": "Hold the end frame", "보간 없이 앞뒤 프레임을 붙잡아 길이만 늘림": "Extends the length by freezing the first or last frame — no interpolation", "{0} → {1}프레임 · {2} 홀드 ({3}) · 새로 그리는 픽셀 없음": "{0} → {1} frames · held at the {2} ({3}) · no pixel drawn", "뒤": "end", "앞": "start", "붙일 것 없음": "nothing to add", "홀드는 늘리기만 합니다 — {0}장을 {1}장으로 줄이려면 리타임을 쓰세요.": "Hold only lengthens — to go from {0} to {1} frames, use retime.", "붙잡을 자리를 확인하세요 ({0}).": "Check which end to hold ({0}).", "붙잡을 프레임이 없습니다.": "There is no frame to hold.", "플레이트  {0}프레임 · {1}fps · {2}": "Plate  {0} frames · {1}fps · {2}", "{0} → {1}프레임 · {2} 홀드 {3}장  ·  {4}": "{0} → {1} frames · {2} hold of {3}  ·  {4}", "프레임을 읽지 못했습니다.": "No frames could be read.", "뺀 자리  늘리면서 생긴 {0}장": "Removed  {0} frames that the stretch added", "{0} → {1}프레임 · 늘린 자리 {2}장 뺌  ·  {3}": "{0} → {1} frames · removed {2} added frames  ·  {3}", "끝 홀드": "Hold last frame", "원본을 1:1 로 쓰고 모자란 길이만 마지막 프레임으로 채웁니다": "Keeps every source frame 1:1 and fills the remaining length by holding the last frame.", "끝 홀드는 늘릴 때만 씁니다 — 복제로 갑니다": "Hold last frame only applies when lengthening — using nearest frame instead.", "뺄 자리를": "Frames to remove", "직접 지정": "Pick them myself", "메모와 영상이 맞고 원본 프레임이 모두 남아 있어야 복원할 수 있습니다": "When a note exists it is always the right answer", "뺄 자리": "Frames to remove", "메모 파일": "Note file", "tail:20 = 뒤에서 20장 · head:20 = 앞에서 20장 · 8,21,34 = 그 번호들(1부터) · 240-265 = 그 구간": "tail:20 = last 20 · head:20 = first 20 · 8,21,34 = those numbers (from 1) · 240-265 = that range", "끝을 붙잡아 늘린 것을 되돌릴 때": "Undoing a hold-the-last-frame stretch", "샷 검사로 정지 구간을 확인할 수 있지만, 원래 정지한 장면과 추가된 홀드는 직접 구분해야 합니다.": "If you do not know how many were added, run \"Review shot\" first to find the frozen stretch.", "메모가 왜 필요한가요?": "Why does it need a note?", "길이가 그대로입니다": "length is unchanged", "장 늘어납니다": " longer", "장 줄어듭니다": " shorter", "줄일 때는 원본 프레임을 고르게 솎아 냅니다. 새로 그리는 프레임은 없습니다.": "Shortening drops source frames evenly across the clip. Nothing new is drawn.", "끝 홀드는 앞을 1:1 로 두고 모자란 길이만 마지막 프레임으로 채웁니다 — 앞 구간이 한 프레임도 밀리지 않습니다.": "Hold last frame keeps the head 1:1 and fills only the missing length with the last frame, so nothing in the head shifts.", "예시 · 늘려 둔 8프레임": "Example · 8 stretched frames", "예시 · 되돌린 5프레임": "Example · 5 frames after undo", "점선 = 늘리면서 생긴 자리": "dashed = frames the stretch added", "메모에 어디였는지 적혀 있으면": "When the note records where", "그 자리만 빼냅니다 — 다시": "it removes exactly those — it", "추측하지 않습니다": "does not guess again", "메모가 없으면 뺄 자리를 직접 말할 수 있습니다 (뒤에서 N장 · 번호 · 구간)": "With no note you can name the frames yourself (last N · numbers · a range)", "여기서 줄이면 무엇이 다른가요?": "What is different about shortening here?", "메모와 상관없이 전 구간에서 고르게 솎아 냅니다. 그래서 남은 프레임이 원본의 몇 번이었는지가 어긋납니다.": "It ignores the note and thins the whole clip evenly, so the remaining frames no longer map back to the source.", "메모가 있고 원본 프레임이 모두 남아 있을 때만 원본 길이로 되돌릴 수 있습니다.": "A note can restore the original length only when every source frame remains.", "무엇을": "What to do", "늘리기": "Make it longer", "줄이기": "Make it shorter", "늘리기 · 줄이기 · 늘린 것 되돌리기": "Longer · shorter · undo a stretch", "늘렸던 것을 되돌리는 중이라면 위에서 \"늘린 것 되돌리기\" 를 고르세요 — 늘리면서 생긴 자리를 그 자리로 빼냅니다.": "Undoing a stretch? Pick \"Undo a stretch\" above — it removes exactly the frames the stretch added.", "메모대로": "From the note", "메모를 창에 끌어다 놓거나 찾아보기를 누르세요": "Drop the note onto the window, or press Browse", "찾아보기": "Browse", "비우기": "Clear", "목록에 있는 메모": "Notes in your list", "메모": "Note", "메모장(.txt)이나 늘림메모(.json)를 창에 끌어다 놓으면 이 칸에 들어옵니다.": "Drop a retiming note (.txt) or a stretch note (.json) onto the window and it lands in this field.", "비워 두면 영상 옆의 늘림메모를 먼저 보고, 없으면 영상 안에 심어 둔 것을 읽습니다.": "Left blank, it looks for the stretch note beside the video, then the copy embedded in the video itself.", "메모는 .txt 또는 .json 입니다.": "A note is a .txt or .json file.", "파일 대화상자를 열지 못했습니다.": "Could not open the file dialog.", "되돌리기는 다시 계산하는 것이 아니라 고르는 것입니다. 메모에 적힌 자리를 그대로 빼냅니다.": "Undoing is picking, not recalculating. It removes exactly the positions the note records.", "다시 추정하면 늘릴 때와 뺄 때가 어긋나는데, 그건 아무도 못 알아챕니다. 넣은 영상의 프레임 수가 메모와 맞지 않으면 아무것도 만들지 않고 멈춥니다.": "Guessing again would put the stretch and the removal out of step, and nobody would notice. If the video does not match what the note expects, it stops without writing anything.", "\"끝 홀드\" 로 늘렸다면 붙잡힌 자리는 전부 꼬리에 있습니다. 245장을 265장으로 늘렸다면 tail:20 입니다.": "If you stretched with \"Hold last frame\", every held frame sits at the tail. 245 stretched to 265 means tail:20.", "새로 생긴 프레임 없음 — 원본 프레임만 골라 썼습니다": "No new frames — only source frames were used", "    늘릴 때 남긴 메모를 보고 보간으로 넣은 자리만 뺍니다.\n\n      framing revert 컷_01_plate.mov                        옆의 메모를 알아서 찾습니다\n      framing revert 컷_01.mov --note-file 컷_01_리타임메모.txt\n      framing revert 컷_01.mov --note-file 늘림메모.json\n\n    리타임 메모장(.txt)을 줘도 됩니다 — 거기 적힌 프레임 번호를 뺍니다.\n    메모를 잃어버려도 영상 안에 심어 둔 것이 있으면 되돌아갑니다.\n    넣은 영상의 프레임 수가 메모와 다르면 (자르거나 다른 영상이면)\n    아무것도 만들지 않고 멈춥니다.\n\n    메모가 아예 없으면 어디를 뺄지 직접 말할 수 있습니다.\n\n      framing revert 컷.mov --drop tail:20        뒤에서 20장\n      framing revert 컷.mov --drop head:20        앞에서 20장\n      framing revert 컷.mov --drop 8,21,34        그 번호들 (1부터)\n      framing revert 컷.mov --drop 240-265        구간\n\n    메모와 영상이 맞아도 원본 프레임이 모두 남아 있어야 원본 길이로 복원됩니다.": "    Reads the note left by the stretch and removes only the frames it added.\n\n      framing revert cut_01_plate.mov                       finds the note beside it\n      framing revert cut_01.mov --note-file cut_01_retime-notes.txt\n      framing revert cut_01.mov --note-file stretch-note.json\n\n    A retiming note (.txt) works too — it removes the frame numbers written there.\n    Even if the note file is lost, the copy embedded in the video gets you back.\n    If the video does not have the frame count the note expects (trimmed, or a\n    different video), nothing is written and it stops.\n\n    With no note at all, you can name the frames to remove yourself.\n\n      framing revert cut.mov --drop tail:20        last 20\n      framing revert cut.mov --drop head:20        first 20\n      framing revert cut.mov --drop 8,21,34        those numbers (from 1)\n      framing revert cut.mov --drop 240-265        that range\n\n    Naming them yourself is the fallback — when a note exists it is always right.", "      framing hold 컷_01.mov --frames 46            뒤를 붙잡습니다 (기본)\n      framing hold 컷_01.mov --seconds 2 --hold-where head\n      framing hold 컷_01.mov --frames 46 --hold-where both\n\n    새로 그리는 픽셀이 없어서 플레이트가 그대로 남습니다. 대신 붙잡은 자리는\n    멈춰 있으니, 꼬리가 움직이는 컷이면 RIFE 쪽(plate)을 쓰세요.\n    늘림 메모를 남기므로 framing revert 로 되돌아갑니다.": "      framing hold cut_01.mov --frames 46            holds the tail (default)\n      framing hold cut_01.mov --seconds 2 --hold-where head\n      framing hold cut_01.mov --frames 46 --hold-where both\n\n    No pixel is redrawn, so the plate survives intact. The held stretch simply\n    stops, so for a cut whose tail is still moving use the RIFE route (plate).\n    It leaves a stretch note, so framing revert takes you back.", "길이   {0} → {1}프레임": "Length  {0} → {1} frames", "{0} {1}장 · 프레임 번호 (결과 기준, 1부터)": "{0} {1} frames · frame numbers (output, starting at 1)", "납품 (ProRes 4444 XQ)": "Delivery (ProRes 4444 XQ)", "납품 (4444 XQ)": "Delivery (4444 XQ)", "MOV · 4444 XQ · 1920×1080 · 24fps · 샷코드_테스크_v###": "MOV · 4444 XQ · 1920×1080 · 24fps · shot_task_v###", "MOV · ProRes 4444 XQ · 1920×1080 · 24fps 로 고정합니다. 규격이 다르면 맞추면서 알려 드립니다.": "Locked to MOV · ProRes 4444 XQ · 1920×1080 · 24fps. Anything off spec is conformed, and it tells you what it changed.", "샷코드": "Shot code", "테스크": "Task", "버전": "Version", "비우면 원본 이름에서 물려받습니다": "Leave blank to inherit it from the source name", "A_0002C007_org_v001 → A_0002C007": "A_0002C007_org_v001 → A_0002C007", "비우면 안 쓰인 다음 번호": "Leave blank for the next unused number", "나올 이름": "Resulting name", "(첫 파일 기준)": "(for the first file)", "규격이 안 맞으면 어떻게 되나요?": "What if the source is off spec?", "해상도가 다르면 비율을 지킨 채 1920×1080 안에 넣고 남는 자리를 검게 채웁니다. 늘려서 찌그러뜨리지 않습니다.": "A different resolution is fitted inside 1920×1080 with its aspect kept and the rest padded black. Nothing is stretched.", "fps 가 24 가 아니면 프레임을 버리거     if (k === 'class') n.className = v;

    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);

  if (!s) return '?';
  const m = Math.floor(s / 60);
  return `${m}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
};

/**
 * 지금 무슨 말로 보여줄지 정하는 자리. 여기 하나만 물어보면 된다.
 *
 * 고른 언어는 파이썬 쪽에 적어 둔다 — 창 모드는 file:// 이라 브라우저
 * 저장소를 믿기 어렵고, 무엇보다 다음에 열어도 그대로여야 한다.
 */
class Lang {
  static KEY = 'framing.lang';
  static now = 'en';                 // 기본은 영어. 헤더에서 한 번에 바꾼다.

  static set(code) {
    Lang.now = code === 'kr' ? 'kr' : 'en';
    try { localStorage.setItem(Lang.KEY, Lang.now); } catch (_) {}
    return Lang.now;
  }

  /** 파이썬이 기억해 둔 것 → 브라우저에 남은 것 → 기본(영어) 순으로 본다. */
  static adopt(saved) {
    if (saved === 'kr' || saved === 'en') return Lang.set(saved);
    let kept = null;
    try { kept = localStorage.getItem(Lang.KEY); } catch (_) {}
    return Lang.set(kept || 'en');
  }

  static get other() { return Lang.now === 'kr' ? 'en' : 'kr'; }
  static get label() { return Lang.now === 'kr' ? 'EN' : 'KO'; }
}

/** 한국어를 넣으면 지금 언어로 돌려준다. 표에 없으면 넣은 그대로. */
const t = (korean) => Messages.text(korean, Lang.now, 'kr', 0, true);

/**
 * 숫자가 붙는 말은 언어마다 붙는 자리가 다르다 — "3개" 와 "3 files".
 * 그 차이만 여기서 맡는다.
 */
const Words = {
  // [한국어, 영어 하나, 영어 여럿] — 영어는 하나일 때 말이 달라진다
  UNITS: {
    files: ['개', ' file', ' files'], frames: ['장', ' frame', ' frames'],
    pairs: ['쌍', ' pair', ' pairs'],
    picked: ['개 골랐습니다', ' selected', ' selected'],
  },

  count(n, unit = 'files') {
    const words = Words.UNITS[unit] || Words.UNITS.files;
    if (Lang.now === 'kr') return `${n}${words[0]}`;
    return `${n}${n === 1 ? words[1] : words[2]}`;
  },

  kind(key) {
    return t({ video: '영상', image: '이미지', sequence: '시퀀스' }[key] || key);
  },

  /** 대조 내보내기 단추. 나오는 것이 대조 한 편뿐이라는 걸 말 안에 넣는다. */
  saveAs(kind) {
    return Lang.now === 'kr' ? `대조만 ${kind} 로 저장`
                             : `Export comparison (${kind})`;

/** Legacy engine messages use the shared whole-message catalog. */

/**
 * 파이썬으로 가는 길은 세 가지다.
 *   창 모드      window.pywebview.api 를 그대로
 *   브라우저 모드 로컬 서버에 fetch
 *   테스트       끼워 넣은 가짜
 *
 * 반대 방향(파이썬 → 화면)은 어느 모드든 하나다 — 화면이 /events 를 가져온다.
 */
const API_METHODS = ['describe', 'inspect', 'pick_files', 'pick_folder',
                     'resolve_picks', 'delivery_name', 'run', 'cancel', 'reveal', 'add_paths',
                     'rename_one', 'propose_name', 'keywords', 'keywords_save',
                     'export_compare', 'prefs', 'prefs_save', 'quit',
                     'checkup', 'save_report', 'rename_preview', 'rename_apply', 'rename_undo',
                     'project_save', 'project_import', 'preview_media'];

function makeHttpApi() {
  const shim = {};
  API_METHODS.forEach((name) => {
    shim[name] = async (...args) => {
      const res = await fetch('/call', {
        method: 'POST', headers: { 'Content-Type': 'application/json',
          'X-Framing-Token': window.__framingToken },
        body: JSON.stringify({ method: name, args }),
      });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'unknown error');
      return data.value;
    };
  });
  return shim;
}

/**
 * 오류를 감추지 않는다.
 *
 * 창 모드에는 열어 볼 콘솔이 없다. 그래서 안에서 무슨 일이 나도 화면은
 * 그냥 멈춘 것처럼 보였다 — "파일만 넣으면 오류가 난다" 는 말을 듣고도
 * 무엇이 났는지 알 길이 없었던 이유다.
 *
 * 여기서 세 갈래를 한곳으로 모은다.
 *   · 자바스크립트가 던진 오류 (window.onerror)
 *   · 아무도 받지 않은 약속 (unhandledrejection)
 *   · 파이썬 호출 실패 (ApiGuard 가 함수 이름과 함께 넘긴다)
 * 같은 오류가 되풀이되면 줄을 늘리지 않고 숫자만 올린다.
 */
class ErrorReporter {
  static MAX = 4;

  constructor(box) {
    this._box = box;
    this._seen = new Map();
    this.book = [];              // 지금까지 있었던 오류 (닫아도 남는다)
  }

  /** 던져진 것이 무엇이든 사람이 읽을 한 줄로. */
  static text(thrown) {
    if (thrown === null || thrown === undefined) return t('알 수 없는 오류');
    if (typeof thrown === 'string') return thrown;
    if (thrown.message) return String(thrown.message);
    try { return JSON.stringify(thrown).slice(0, 300); }
    catch (_) { return String(thrown); }
  }

  watch() {
    window.addEventListener('error', (e) => {
      if (!e || (e.target && e.target !== window)) return;   // 이미지 404 는 오류가 아니다
      this.say(this._where(e), ErrorReporter.text(e.error || e.message));
    });
    window.addEventListener('unhandledrejection', (e) =>
      this.say(t('받지 못한 응답'), ErrorReporter.text(e && e.reason)));
    return this;
  }

  _where(e) {
    const file = String(e.filename || '').split(/[\\/]/).pop();
    return e.lineno ? `${file || t('화면')}:${e.lineno}` : t('화면');
  }

  say(where, what) {
    const key = `${where}|${what}`;
    // 화면의 줄은 닫으면 사라지지만, 있었다는 사실은 남겨 둔다.
    // 진단서에 실어야 하는데, 그때쯤이면 대개 이미 닫아 버린 뒤다.
    this.book.push(`${new Date().toISOString()}  ${where} — ${what}`);
    if (this.book.length > 40) this.book.shift();
    const old = this._seen.get(key);
    if (old && old.node.isConnected) {
      old.count += 1;
      old.tally.textContent = `×${old.count}`;
      return;
    }
    const tally = el('span', { class: 'tally', text: '×1' });
    const line = el('div', { class: 'alert' },
      el('b', { text: t(where), title: t(where) }),
      el('span', { class: 'what', text: t(what), title: t(what) }), tally,
      el('button', { class: 'btn ax word', text: t('복사'),
        onclick: () => ErrorReporter.copy(`${where} — ${what}`) }),
      el('button', { class: 'btn ax word', text: t('닫기'),
        onclick: () => { line.remove(); this._seen.delete(key); } }));
    this._box.append(line);
    this._seen.set(key, { node: line, count: 1, tally });
    while (this._box.children.length > ErrorReporter.MAX) {
      this._box.firstElementChild.remove();
    }
  }

  /** 창 모드에는 클립보드 권한이 없을 수 있어서 옛 방법을 남겨 둔다. */
  /** 됐으면 true. 진단서는 "복사됐다" 를 믿을 수 있어야 한다. */
  static async copy(text) {
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
    } catch (_) { /* 아래로 */ }
    const hole = document.createElement('textarea');
    hole.value = text;
    hole.style.cssText = 'position:fixed;left:-9999px;top:0';
    document.body.append(hole);
    hole.select();
    let done = false;
    try { done = document.execCommand('copy'); } catch (_) {}
    hole.remove();
    return done;
  }
}

/**
 * 파이썬으로 가는 모든 호출을 감싼다.
 *
 * 감싸는 이유는 하나다 — 실패했을 때 "무엇이" 실패했는지 이름이 남게 하려고.
 * 예전에는 inspect() 가 실패하면 그저 아무 일도 일어나지 않았다.
 * 없는 함수를 부르는 경우(옛 pywebview 는 인자 여러 개를 못 넘긴다)도
 * 여기서 걸린다.
 */
class ApiGuard {
  constructor(raw, report) { this._raw = raw; this._report = report; }

  wrap() {
    const safe = {};
    API_METHODS.forEach((name) => { safe[name] = (...args) => this._call(name, args); });
    return safe;
  }

  async _call(name, args) {
    const fn = this._raw[name];
    if (typeof fn !== 'function') {
      const oops = new Error(`${name}() 을 창이 내주지 않습니다 (pywebview 판이 낮을 수 있습니다)`);
      this._tell(name, oops);
      throw oops;
    }
    try {
      return await fn.apply(this._raw, args);
    } catch (err) {
      this._tell(name, err);
      throw err;
    }
  }

  _tell(name, err) {
    if (this._report) this._report.say(`${name}()`, ErrorReporter.text(err));
  }
}

/**
 * 진단서. "오류가 나요" 를 파일 한 장으로 바꾼다.
 *
 * 화면만 아는 것(무슨 파일을 넣었는지, 어떤 도구였는지, 기록, 자바스크립트
 * 오류)과 파이썬만 아는 것(판·파이썬·ffmpeg·열린 방식)을 한 자리에 모은다.
 * 둘 중 하나만으로는 늘 부족해서, 물어보고 또 물어보게 된다.
 */
class Doctor {
  constructor(app) { this._app = app; }

  /** 한 장짜리 글. 그대로 복사하거나 파일로 남긴다. */
  async write() {
    const parts = [t('Framing 진단서'), ''];
    for (const [key, value] of Object.entries(await this._python())) {
      parts.push(`${t(key).padEnd(24)}  ${t(value)}`);
    }
    parts.push('', '── 화면 ──');
    for (const [key, value] of Object.entries(this._screen())) {
      parts.push(`${t(key).padEnd(24)}  ${t(value)}`);
    }
    parts.push('', '── 넣은 파일 ──', ...this._files());
    parts.push('', '── 마지막 기록 ──', ...this._log());
    const errors = (window.__errors && window.__errors.book) || [];
    parts.push('', '── 오류 ──',
               ...(errors.length ? errors : ['없음']));
    return parts.map(part => t(part)).join('\n');
  }

  async _python() {
    try { return await api().checkup(); }
    catch (err) { return { '파이썬': `물어보지 못했습니다 — ${err}` }; }
  }

  _screen() {
    const app = this._app;
    return {
      '말': Lang.now,
      '주소': location.href,
      '창': `${innerWidth}×${innerHeight}`,
      '도구': app.recipe.order.join(' → ') || '고른 것 없음',
      '고른 것': `${app.picked.size} / ${app.files.count}`,
      '도는 중': app.busy ? '예' : '아니오',
      '브라우저': navigator.userAgent,
    };
  }

  _files() {
    const rows = this._app.files.rows().slice(0, 12);
    if (!rows.length) return ['없음'];
    return rows.map((r) => `${r.kind.padEnd(9)}${r.v.name}` +
      (r.v.info ? `  ·  ${t(r.v.info)}` : ''));
  }

  _log() {
    const lines = [...$('#log').querySelectorAll('.line')]
      .slice(-25).map((n) => n.textContent.trim());
    return lines.length ? lines : ['없음'];
  }
}

let _api = null;
let _report = null;
const useReporter = (r) => { _report = r; };
const api = () => {
  if (_api) return _api;
  let raw = null;
  if (window.pywebview && window.pywebview.api) raw = window.pywebview.api;
  else if (window.__stubApi) raw = window.__stubApi;
  else if (location.protocol.startsWith('http')) raw = makeHttpApi();
  if (raw) _api = new ApiGuard(raw, _report).wrap();
  return _api;
};

/** 브라우저 모드에서는 이벤트를 주기적으로 가져와야 한다. */
async function pumpEvents() {
  let after = -1;                 // 음수 = "지난 건 됐고 지금부터"

  for (;;) {
    try {
      const r = await (await fetch('/events?after=' + after, { headers: { 'X-Framing-Token': window.__framingToken } })).json();
      (r.events || []).forEach((e) => window.onEngineEvent && window.onEngineEvent(e.kind, e.payload));
      if (typeof r.next === 'number') after = r.next;
    } catch (_) { /* 서버가 잠깐 없으면 다음 번에 */ }
    await new Promise((r) => setTimeout(r, 250));
  }
}

/**
 * "지금 뭘 하는 중" 을 알리는 띠.
 *
 * 파일을 넣으면 파일마다 ffprobe 가 돈다. 열댓 개만 돼도 몇 초가 걸리는데
 * 그동안 화면이 가만히 있으면 눌린 건지 멈춘 건지 알 수가 없다.
 *
 * 겹쳐 부를 수 있게 셈을 센다 — 안쪽 일이 끝났다고 바깥 일까지 끝난 척하지 않는다.
 */
class Busy {
  constructor(node, label) {
    this._node = node;
    this._label = label;
    this._depth = 0;
  }

  /** 일 하나를 감싼다. 끝나든 넘어지든 띠는 반드시 걷힌다. */
  async during(work) {
    this.start();
    try {
      return await work();
    } finally {
      this.stop();
    }
  }

  start() {
    this._depth += 1;
    this._label.textContent = t('로딩중…');
    this._node.hidden = false;
  }

  stop() {
    this._depth = Math.max(0, this._depth - 1);
    if (!this._depth) this._node.hidden = true;
  }
}

/**
 * 무언가를 눈에 들여놓는다.
 *
 * 그냥 scrollIntoView 를 부르면 오른쪽 칸과 창이 같이 굴러서, 애써 옆에
 * 세워 둔 파일 표가 위로 사라진다. 오른쪽 칸 안에 있는 것이면 그 칸만 굴린다.
 */
class Focus {
  static on(selector) {
    const node = $(selector);
    if (!node) return;
    const column = $('#right');
    const scrolls = column && getComputedStyle(column).overflowY === 'auto';
    if (scrolls && column.contains(node)) {
      const gap = node.getBoundingClientRect().top - column.getBoundingClientRect().top;
      column.scrollTo({ top: column.scrollTop + gap - 8, behavior: 'smooth' });
      return;
    }
    node.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }
}

/**
 * 창 위로 파일을 끌어다 놓는 자리.
 * 경로를 알아내는 일은 파이썬이 한다 (브라우저는 경로를 안 알려준다).
 * 여기서는 화면 반응과, 경로를 못 얻었을 때의 안내만 맡는다.
 */
class DropZone {
  constructor(onPaths, onPathsUnavailable, onWaiting) {
    this._onPaths = onPaths;
    this._onUnavailable = onPathsUnavailable;
    this._onWaiting = onWaiting || (() => {});
    this._depth = 0;
  }

  /** pywebview 가 File 에 경로를 얹어 주는 판도 있다. 있으면 바로 쓴다. */
  static pathsIn(event) {
    const files = (event.dataTransfer && event.dataTransfer.files) || [];
    const found = [];
    for (const file of files) {
      const full = file.pywebviewFullPath || file.path;
      if (full) found.push(full);
    }
    return found;
  }

  attach(root) {
    ['dragenter', 'dragover'].forEach((name) =>
      root.addEventListener(name, (e) => { e.preventDefault(); this._enter(); }));
    root.addEventListener('dragleave', (e) => { e.preventDefault(); this._leave(); });
    root.addEventListener('drop', (e) => {
      e.preventDefault();
      this._reset();
      const paths = DropZone.pathsIn(e);
      if (paths.length) { this._onPaths(paths); return; }   // 여기서 보이면 바로 쓴다
      // 창 모드면 파이썬이 'dropped' 이벤트로 진짜 경로를 보내준다.
      // 그 사이가 비어 보이지 않게 기다린다고 알려 준다.
      if (window.pywebview) { this._onWaiting(); return; }
      this._onUnavailable(e);
    });
    window.addEventListener('blur', () => this._reset());
  }

  _enter() { this._depth++; document.body.classList.add('dropping'); }
  _leave() { if (--this._depth <= 0) this._reset(); }
  _reset() { this._depth = 0; document.body.classList.remove('dropping'); }
}

      for (let y = 0; y < H; y++) {
        let row = '';
        for (let x = 0; x < W; x++) {
          const edge = y === 0 || y === H - 1;
          const rail = x < 2 || x >= W - 2;
          const hole = rail && (y === 2 || y === 5 || y === 8);
          const top = 3, bottom = 7;                   // 재생 표시가 놓이는 줄
          const reach = Math.min(y - top, bottom - y);
          const play = y >= top && y <= bottom && x >= 4 && x <= 4 + reach;
          row += edge ? 'c' : hole ? 'k' : play ? 'o' : rail ? 'c' : 'd';
        }
        rows.push(row);

      return rows;

    // 오른쪽 칸이 아직 비었을 때 세워 두는 빈 설정판

   * 그림이라 묶으면 대개 열 배 가까이 줄어든다.
   */
  const draw = (name, size) => {
    const rows = MAPS[name];
    if (!rows) return '';
    const h = rows.length, w = rows[0].length;
    let body = '';
    rows.forEach((row, y) => {
      let x = 0;
      while (x < row.length) {
        const fill = PAL[row[x]];
        let run = 1;
        while (x + run < row.length && row[x + run] === row[x]) run++;
        if (fill) body += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${fill}"/>`;
        x += run;
      }
    });
    return `<svg viewBox="0 0 ${w} ${h}" width="${size || 22}" ` +
           `height="${Math.round((size || 22) * h / w)}" ` +
           `shape-rendering="crispEdges" aria-hidden="true">${body}</svg>`;
  };
  return { draw };
})();

/**
 * 화면의 뼈대: 파일이 먼저다.
 *
 * 무엇을 넣었는지 보고 나서야 할 수 있는 일이 정해진다. 그래서 빈 화면은
 * 통째로 드롭존이고, 넣는 순간 그것으로 할 수 있는 일만 카드로 나온다.
 * 메뉴를 뒤져 작업을 먼저 고르게 하는 화면은 순서가 거꾸로였다.
 */

/** Small contextual guides share one presentation and translation path. */
class HelpCard {
  static create(title, paragraphs) {
    return el('details', {class:'workflow-help'}, el('summary', {text:t(title)}),
      ...paragraphs.map(text=>el('p',{text:t(text)})));
  }
}

class Files {
  static get EMPTY() { return { videos: [], images: [], sequences: [], missing: [] }; }

  /** Windows pickers use '/', while Python facts use '\\'. Compare identities,
   * then retain the path supplied by inspection for selection and execution. */
  static pathKey(path) {
    const value = String(path).replace(/\\/g, '/').replace(/\/+$/, '');
    return /^[a-z]:\//i.test(value) || value.startsWith('//') ? value.toLowerCase() : value;
  }

  /** busy 는 "살펴보는 중" 띠. 없어도 돌아간다 — 시험판은 안 넘긴다. */
  constructor(busy = null) {
    this.paths = [];
    this.found = Files.EMPTY;
    this.trouble = null;
    this._busy = busy;
  }

  get empty() { return this.paths.length === 0; }
  get count() {
    return (this.found.videos || []).length + (this.found.images || []).length
         + (this.found.sequences || []).length;
  }
  get kinds() {
    return { video: (this.found.videos || []).length,
             image: (this.found.images || []).filter(x => !x.other).length,
             file: (this.found.images || []).filter(x => x.other).length,
             sequence: (this.found.sequences || []).length };
  }

  async add(newPaths) {
    const known = new Set(this.paths.map(Files.pathKey));
    for (const p of newPaths) {
      const key = Files.pathKey(p);
      if (!known.has(key)) { this.paths.push(p); known.add(key); }
    }
    await this.refresh();
  }
  async remove(path) {
    this.paths = this.paths.filter((p) => Files.pathKey(p) !== Files.pathKey(path));
    await this.refresh();
  }
  /** 없는 파일만 목록에서 치운다. 몇 개를 치웠는지 돌려준다. */
  sweepMissing() {
    const gone = new Set((this.found.missing || []).map(Files.pathKey));
    if (!gone.size) return 0;
    this.paths = this.paths.filter((p) => !gone.has(Files.pathKey(p)));
    this.found = { ...this.found, missing: [] };
    return gone.size;
  }

  /**
   * 파이썬에게 "이게 뭐냐" 고 물어 표를 다시 그린다.
   *
   * 물어보다 실패해도 목록을 비우지 않는다. 예전에는 여기서 던진 오류가
   * 위로 새어 나가 그리는 일 자체가 멈췄고, 화면은 파일을 넣은 순간
   * 굳어 버린 것처럼 보였다. 실패는 실패대로 적어 두고 화면은 계속 돈다.
   */
  async refresh() {
    const revision = this.revision = (this.revision || 0) + 1;
    const paths = [...this.paths];
    if (!paths.length) {
      this.found = Files.EMPTY;
      this.trouble = null;
      return;
    }
    let seen = null;
    const ask = () => api().inspect(paths, window.__framing?.intent === 'name' ? 'rename' : '');
    try {
      seen = this._busy ? await this._busy.during(ask) : await ask();
    } catch (err) {
      if (revision === this.revision) this.trouble = ErrorReporter.text(err);
      return;                                  // 앞서 알아낸 것을 그대로 두고 버틴다
    }
    if (revision !== this.revision) return;
    this.trouble = null;
    this.found = seen && seen.videos ? seen : Files.EMPTY;
    this._expand();
  }

  /**
   * 폴더를 넣었으면 그 안에서 찾은 것들로 목록을 바꾼다.
   *
   * 예전에는 넣은 경로(폴더)만 목록에 두고 그렸다. 그런데 그림 그리는 쪽은
   * 폴더가 아니라 그 안의 파일을 알고 있어서, 폴더를 고르면 표가 텅 빈 채로
   * "3개 있음" 이라고만 나왔다. 보이는 것과 도는 것이 다르면 그게 제일 나쁘다.
   * (번호 붙은 그림 폴더는 시퀀스 한 덩어리라 폴더 그대로 둔다.)
   */
  _expand() {
    const f = this.found;
    const all = [...(f.sequences || []), ...(f.videos || []), ...(f.images || [])]
      .map((x) => x.path);
    const known = new Map(all.map(p => [Files.pathKey(p), p]));
    const under = (parent, child) => Files.pathKey(child).startsWith(Files.pathKey(parent) + '/');
    const next = [];
    for (const p of this.paths) {
      const key = Files.pathKey(p);
      if (known.has(key)) { next.push(known.get(key)); continue; }
      const kids = all.filter((k) => under(p, k));
      if (kids.length) next.push(...kids);
      else next.push(p);                         // 없는 파일도 오류 행으로 표시
    }
    this.paths = [...new Set(next)];
  }

  /** 화면에 줄 세울 순서: 넣은 순서 그대로 (A/B 가 이 순서를 따른다) */
  rows() {
    const facts = new Map();
    (this.found.videos || []).forEach((v) => facts.set(v.path, { kind: 'video', v }));
    (this.found.images || []).forEach((g) => facts.set(g.path, { kind: g.other ? 'file' : 'image', v: g }));
    (this.found.sequences || []).forEach((q) => facts.set(q.path, { kind: 'sequence', v: q }));
    const out = [];
    for (const p of this.paths) {
      if (facts.has(p)) out.push({ path: p, ...facts.get(p) });
    }
    (this.found.missing || []).forEach((m) => out.push({ path: m, kind: 'bad', v: null }));
    return out;
  }
}

/**
 * 지금 설정이 길이를 늘리는가 줄이는가.
 *
 * 늘릴 때와 줄일 때는 고를 것이 아예 다르다. 늘리면 "없던 자리를 무엇으로
 * 채울까" 이고, 줄이면 "있는 자리 중 무엇을 뺄까" 다. 그런데 화면은 둘을
 * 한 줄에 같이 놓고 있었다 — 줄이는 중에도 "끝 홀드" 와 "모션보간" 이
 * 눌리는 것처럼 보였고, 실제로는 눌러도 복제로 갔다. 눌리는 것과 도는 것이

class InputFeedback {
  static clear(panel) {
    panel.querySelector('#inputIssue')?.remove();
    panel.querySelectorAll('[aria-describedby="inputIssue"]').forEach(input=>{
      input.removeAttribute('aria-describedby');input.removeAttribute('aria-invalid');
    });
  }
  static show(panel,issue) {
    this.clear(panel);
    const message=el('p',{id:'inputIssue',class:'help dhint',role:'alert',text:issue.message,'data-option':issue.key,tabindex:'-1'});
    panel.prepend(message);
    const input=panel.querySelector(`input[data-option="${issue.key}"]`);
    if(input){input.setAttribute('aria-invalid','true');input.setAttribute('aria-describedby','inputIssue');}
    const focus=input||message;focus.focus();focus.scrollIntoView({block:'center'});
  }
  static refresh(panel,issue) {
    const message=panel.querySelector('#inputIssue');if(!message)return;
    if(!issue || issue.key!==message.dataset.option)this.clear(panel);
    else message.textContent=issue.message;
  }
}

class RetimeWorkflow {
  static isRife(options) { return options.retimeWay !== 'undo' && options.retimeMode === 'rife'; }
  static restore(step, defaults) {
    const options = JSON.parse(JSON.stringify(defaults));
    Object.keys(options).forEach(key => { if (Object.hasOwn(step.options, key)) options[key] = step.options[key]; });
    if (step.key === 'plate') {
      options.retimeWay = 'stretch'; options.retimeMode = 'rife';
      options.lengthMode = 'frames';
    }
    for(const key of ['plateNoSnap','rifeProgram'])
      if(Object.hasOwn(step.options,key))options[key]=step.options[key];
    return {key: step.key === 'plate' ? 'retime' : step.key, options};
  }
  static problem(options, kinds) {
    if (!this.isRife(options)) return null;
    if (kinds.sequence || kinds.image) return {key:'retimeMode',message:t('RIFE는 영상 파일을 사용합니다. 이미지 시퀀스는 먼저 영상으로 변환하거나 FFmpeg를 선택하세요.')};
    if (options.lengthMode === 'frames' && Number(options.targetFrames) < 2)
      return {key:'targetFrames',message:t('RIFE 결과는 2프레임 이상으로 정해 주세요.')};
    return null;
  }
  static description(mode, options = {}) {
    if(mode === 'auto' && options.noSnap)
      return '알아서: 늘릴 때는 FFmpeg 모션 보간, 줄일 때는 원본 프레임 선택을 사용합니다. 원본 색을 유지합니다.';
    return ({
      rife:'RIFE는 AI와 GPU로 중간 장면을 만듭니다. 자연스러운 움직임을 원할 때 시도해 보세요. GPU와 장면에 따라 속도와 결과가 달라집니다.',
      motion:'FFmpeg는 앞뒤 프레임의 움직임을 계산해 중간 장면을 만듭니다. 이 앱에서는 CPU로 처리하므로 별도 AI용 GPU 없이 사용할 수 있습니다.',
      auto:'알아서: 매트는 복제로 보호하고, 일반 영상을 늘릴 때는 FFmpeg 모션 보간을 사용합니다.',
      dup:'복제는 가까운 원본 프레임을 골라 씁니다. 새 이미지를 만들지 않아 매트나 원본 색을 지킬 때 편합니다.',
      blend:'겹치기는 앞뒤 이미지를 섞습니다. 움직임을 새로 계산하지 않아 잔상이 보일 수 있습니다.',
      hold:'끝 홀드는 원본을 그대로 두고 마지막 프레임을 붙잡아 길이만 늘립니다.'
    })[mode] || '';
  }
}

class OptionInput {
  // Numeric editor and preflight share the same rules; rendering owns no coercion.
  static rules = {
    count:['몇 장',1,1000000,1], every:['간격(프레임)',1,1000000,1],
    targetFrames:['프레임',1,6000,1], targetSeconds:['초',0.000001,1000000,'any'],
    speed:['배속',0.000001,1000000,'any'], fps:['시퀀스 FPS',1,240,'any'],
    auditFreezeSeconds:['홀드 최소 길이(초)',0.1,10,'any'],
    gifFps:['GIF FPS',1,50,'any'], maxHeight:['세로 상한(px)',0,1000000,1],
    cutMinSeconds:['최소 컷 길이(초)',0.1,600,'any'],
    cutInterval:['분할 간격(초)',0.1,86400,'any']
  };
  static read(value) { return value.trim() === '' ? '' : Number(value); }
  static problem(key,value) {
    const rule=this.rules[key]; if(!rule)return '';
    const [label,min,max,step]=rule,n=Number(value);
    if(value === '' || value == null || !Number.isFinite(n))return `${t(label)}: ${t('숫자를 입력하세요.')}`;
    if(n<min || n>max || (step===1 && !Number.isInteger(n)))
      return `${t(label)}: ${min}–${max} · ${t(step===1?'정수로 입력하세요.':'범위 안의 숫자를 입력하세요.')}`;
    return '';
  }
  static validate(step,kinds) {
    const o=step.options,keys=[],key=step.key;
    if(key==='retime'){const issue=RetimeWorkflow.problem(o,kinds);if(issue)return issue;}
    if(key==='retime' && o.retimeWay!=='undo')keys.push({frames:'targetFrames',seconds:'targetSeconds',speed:'speed'}[o.lengthMode]||'targetSeconds');
    if(key==='extract' && ['count','every'].includes(o.pickMode))keys.push(o.pickMode);
    if(key==='convert' && o.convertTo==='gif')keys.push('gifFps');
    if(key==='convert' && o.convertTo==='image')keys.push('maxHeight');
    if(key==='audit' || (key==='contact' && o.contactAudit))keys.push('auditFreezeSeconds');
    if(key==='cuts' && o.cutMode!=='manual')keys.push(o.cutMode==='interval'?'cutInterval':'cutMinSeconds');
    if(kinds.sequence && (['reverse','audit','retime'].includes(key) || (key==='contact' && o.contactAudit) || (key==='convert' && ['movie','gif'].includes(o.convertTo))))keys.push('fps');
    for(const name of keys){const message=this.problem(name,o[name]);if(message)return {key:name,message};}
    if(key==='extract' && o.pickMode==='at' && !String(o.at||'').trim())return {key:'at',message:t('뽑을 지점을 입력하세요. 예: 1, 50%, last')};
    if(key==='retime' && o.retimeWay==='undo' && o.revertBy==='manual' && !String(o.dropFrames||'').trim())return {key:'dropFrames',message:t('뺄 프레임을 입력하세요. 예: tail:20')};
    if(key==='cuts' && o.cutMode==='manual' && !String(o.cutTimes||'').trim())return {key:'cutTimes',message:t('나눌 시간을 입력하세요. 예: 3.5, 00:07.2')};
    return null;
  }
}

class LengthChange {
  /**
   * @param {Array} rows  고른 줄들 (표가 만든 모양 그대로)
   * @param {Object} opt  화면의 설정 (lengthMode · targetFrames · …)
   */
  constructor(rows, opt) {
    const lengths = (rows || [])
      .map((r) => (r && r.v ? Number(r.v.frames || 0) : 0))
      .filter((n) => n > 0);
    const same = lengths.length && lengths.every((n) => n === lengths[0]);
    this.source = same ? lengths[0] : 0;
    this.fps = (rows || []).map((r) => (r && r.v ? Number(r.v.fpsExact || r.v.fps || 0) : 0))
      .find((n) => n > 0) || Number(opt.fps) || 24;
    this.sameRate = (rows || []).every(r => !r?.v?.fps || Number(r.v.fpsExact || r.v.fps) === this.fps);
    this._opt = opt;
  }

  static roundFrames(value) {
    const base = Math.floor(value);
    return value - base === 0.5 ? (base % 2 ? base + 1 : base) : Math.round(value);
  }

  /** 설정이 말하는 목표 프레임 수. 엔진의 RetimePlan.decide 와 같은 셈이다. */
  get target() {
    const o = this._opt;
    if (o.lengthMode === 'frames') return Math.max(0, Math.round(Number(o.targetFrames) || 0));
    if (o.lengthMode === 'seconds') return Math.max(0, LengthChange.roundFrames((Number(o.targetSeconds) || 0) * this.fps));
    const speed = Number(o.speed) || 0;
    return speed > 0 && this.source ? LengthChange.roundFrames(this.source / speed) : 0;
  }

  get known() { return this.source > 0 && this.target > 0 && (this._opt.lengthMode === 'frames' || this.sameRate); }
  get stretching() { return this.known && this.target > this.source; }
  get shrinking() { return this.known && this.target < this.source; }
  get gap() { return Math.abs(this.target - this.source); }

  /** 판 위에 한 줄로 적을 말. 모르면 빈 말을 돌려준다. */
  say() {
    if (!this.known) return '';
    if (!this.gap) return `${this.source}${t('프레임')} — ${t('길이가 그대로입니다')}`;
    const way = this.stretching ? '장 늘어납니다' : '장 줄어듭니다';
    return `${this.source} → ${this.target}${t('프레임')} · ${this.gap}${t(way)}`;
  }
}

 * 규칙은 하나다. **고른 게 없으면 아무것도 돌지 않는다.**

 * 그러면 실행을 누르는 순간까지 무엇이 돌지 알 수가 없었다.
 * 지금은 체크된 줄이 곧 돌아갈 목록이다 — 보이는 그대로.
 */

class Selection {
  constructor() {
    this._on = new Set();
    this._last = null;        // Shift 범위의 기준점
  }

  get size() { return this._on.size; }
  get empty() { return this._on.size === 0; }

  has(path) { return this._on.has(path); }
  add(path) { this._on.add(path); return this; }
  delete(path) { return this._on.delete(path); }
  clear() { this._on.clear(); this._last = null; }
  list() { return [...this._on]; }

  /** 보이는 줄을 전부 담거나 전부 푼다. */
  allOf(rows, on) {
    rows.forEach((r) => (on ? this._on.add(r.path) : this._on.delete(r.path)));
    if (!on) this._last = null;
  }

  /** 보이는 줄이 이미 다 담겼는가 (머리 체크상자 모양). */
  covers(rows) {
    return rows.length > 0 && rows.every((r) => this._on.has(r.path));
  }

  /** 목록에서 사라진 파일이 담긴 채로 남지 않게. */
  keepOnly(paths) {
    const alive = new Set(paths);
    [...this._on].forEach((p) => { if (!alive.has(p)) this._on.delete(p); });
    if (this._last && !alive.has(this._last)) this._last = null;
  }

  /** 이름이 바뀌어도 담긴 채로 따라간다. */
  rename(from, to) { if (this._on.delete(from)) this._on.add(to); }

  /** 한 번 찍기. Shift 면 지난번 찍은 줄부터 여기까지 같은 상태로. */
  tick(path, on, ranged, rows) {
    const set = (p) => (on ? this._on.add(p) : this._on.delete(p));
    const here = rows.findIndex((r) => r.path === path);
    const there = this._last === null
      ? -1 : rows.findIndex((r) => r.path === this._last);
    if (ranged && here >= 0 && there >= 0) {
      const [from, to] = here < there ? [here, there] : [there, here];
      for (let i = from; i <= to; i++) set(rows[i].path);
    } else {
      set(path);
    }
    this._last = path;
  }
}

/**
 * 차례표 — 도구를 순서대로 담아 둔다.
 *
 * 카드를 누르면 **그 도구로 바뀐다.** 이어 붙이는 건 카드 구석의 + 로만 한다.
 * 예전에는 누를 때마다 뒤에 붙어서, 도구를 바꾸려던 사람이 자꾸 두 단계짜리
 * 차례표를 만들어 놓곤 했다. 이어 붙이기는 가끔 하는 일이니 따로 눌러야 맞다.
 *
 * 도구 하나만 고른 경우도 단계가 하나인 차례표일 뿐이다 — 길을 둘로 나누지 않는다.
 */
class Recipe {
  constructor(defaults) {
    this._defaults = defaults;
    this.steps = [];          // [{ key, options }]
    this.editing = -1;        // 지금 설정을 고치고 있는 단계
  }

  get length() { return this.steps.length; }
  get empty() { return this.steps.length === 0; }
  get order() { return this.steps.map((s) => s.key); }

  at(index) { return this.steps[index] || null; }
  find(key) { return this.steps.find((s) => s.key === key) || null; }
  place(key) { return this.steps.findIndex((s) => s.key === key); }

  /** 지금 고치고 있는 단계. 없으면 null. */
  get current() { return this.at(this.editing); }
  get currentKey() { return this.current ? this.current.key : null; }

  optionsFor(key) {
    const options=JSON.parse(JSON.stringify(this._defaults));
    if(key==='retime'){options.delivery='bundle';options.noSnap=true;}
    return options;
  }

  /** 혼자만 설 수 있는 도구. 대조는 파일을 만들지 않으니 뒤에 이을 게 없다. */
  static SOLO = ['compare', 'audit', 'contact'];
  static solo(key) { return Recipe.SOLO.includes(key); }
  get hasSolo() { return this.steps.some((s) => Recipe.solo(s.key)); }

  /**
   * 카드를 누른 것 — **이 도구 하나로 바꾼다.**
   *
   * 이미 고른 것을 또 눌러도 해제되지 않는다. 예전에는 두 번째 누름을
   * "취소" 로 받았는데, 대조를 한 번 보고 다시 보려고 카드를 누른 사람에게는
   * 도구가 통째로 사라지는 일이었다 — 실행 단추까지 같이 없어졌다.
   * 카드는 고르는 물건이지 끄는 물건이 아니다.
   *
   * 설정은 그 단계가 이미 있었다면 그대로 물려받는다.
   */
  only(key) {
    const had = this.find(key);
    this.steps = [had || { key, options: this.optionsFor(key) }];
    this.editing = 0;
    return this.current;
  }

  /**
   * + 를 누른 것 — **뒤에 이어 붙인다.**
   * 이미 있으면 그 단계로 옮겨 가기만 한다. 혼자 서는 도구는 이어 붙지 않는다.
   */
  add(key) {
    const at = this.place(key);
    if (at >= 0) { this.editing = at; return this.current; }
    if (Recipe.solo(key) || this.hasSolo) return this.only(key);
    this.steps.push({ key, options: this.optionsFor(key) });
    this.editing = this.steps.length - 1;
    return this.current;
  }

  drop(key) {
    const at = this.place(key);
    this.dropAt(at);
  }

  dropAt(at) {
    if (at < 0) return;
    this.steps.splice(at, 1);
    this.editing = Math.min(this.editing, this.steps.length - 1);
  }

  clear() { this.steps = []; this.editing = -1; }

  /** 지금 넣은 파일로 못 하는 단계는 조용히 뺀다. */
  keepOnly(usable) {
    const before = this.order.join();
    this.steps = this.steps.filter((s) => usable.includes(s.key));
    if (this.steps.length) this.editing = Math.min(Math.max(this.editing, 0),
                                                   this.steps.length - 1);
    else this.editing = -1;
    return before !== this.order.join();
  }
}

/**
 * 파이프라인: 넣기 → 도구 → 실행 → 결과. 지금 어느 칸에 서 있는지 계산만 한다.
 * 결과를 다시 재료로 넣으면 처음 칸으로 돌아간다 — 그게 이 도구를 이어 쓰는 방법이다.
 */
class Pipeline {
  static STEPS = [
    { key: 'in', label: '넣기' },
    { key: 'tool', label: '도구 고르기' },
    { key: 'run', label: '실행' },
    { key: 'out', label: '결과' },
  ];

  static at(app) {
    if (app.busy) return 'run';
    if (app.done) return 'out';
    if (app.jobKey) return 'tool';
    return 'in';
  }
}

/** Shared table construction keeps options, metadata and review rows consistent. */
class TableView {
  static create(headers, className = '') {
    const table = el('table', {class:'data-table '+className});
    const body = el('tbody');
    table.append(el('thead', {}, el('tr', {}, ...headers.map(text=>el('th', {scope:'col',text:t(text)})))), body);
    return {table, body};
  }
  static fields(form) {
    const labels=[...form.querySelectorAll(':scope > label')];
    const {table,body}=TableView.create(labels.map(label=>label.querySelector('span')?.textContent||''),'rename-fields');
    const row=el('tr');
    labels.forEach(label=>{
      const cell=el('td');
      [...label.children].filter(node=>node.tagName!=='SPAN').forEach(node=>cell.append(node));
      row.append(cell);label.remove();
    });
    body.append(row);form.prepend(el('div',{class:'table-scroll'},table));
  }
  static color(color) {
    const metadata=color||{labels:{}};
    const {table,body}=TableView.create(['컬러스페이스 정보','파일에 기록된 값'],'color-table');
    [['색역 / Primaries','primaries'],['전달 함수 / Transfer','transfer'],['매트릭스 / Space','space'],['밝기 범위 / Range','range']].forEach(([label,key])=>{
      body.append(el('tr',{},el('th',{scope:'row',text:t(label)}),el('td',{text:t(metadata.labels?.[key]||'미지정')})));
    });
    body.append(el('tr',{},el('th',{scope:'row',text:t('픽셀 형식')}),el('td',{text:metadata.pixelFormat||t('미지정')})));
    return table;
  }
}

  syncHistory() {

    this.historyOwner = this.app.options; this.historyKey = key;

    const rules=this.rules, last=rules[rules.length-1];
    if(rules[0]?.kind==='clear' && rules[1]?.kind==='prefix' && rules.length<=3 && (!rules[2]||rules[2].kind==='number')) {

      if(rules[2]){this.draft.name=this.draft.name.replace(/_$/,'');this.draft.start=String(rules[2].start??1);this.draft.width=String(rules[2].width??3);}
    } else if(last?.kind==='replace') {

class ProjectActions {
  constructor(app) { this.app = app; }
  snapshot() {
    return {format: 'framing-project', version: 1, name: 'Framing 작업',
      paths: [...this.app.files.paths], selected: [...this.app.basket],
      steps: this.app.recipe.steps.map(step => ({key: step.key, options: JSON.parse(JSON.stringify(step.options))})),
      editing: this.app.recipe.editing};
  }
  async save() {
    if (this.app.busy || this.app.renameStudio.changing) return;
    try {
      const result = await api().project_save(this.snapshot());
      if (!result?.ok) throw new Error(result?.error || '작업 저장 실패');
      if (result.cancelled) return;
      if (result.document) {
        const url = URL.createObjectURL(new Blob([result.document], {type: 'application/json;charset=utf-8'}));
        const link = el('a', {href: url, download: result.filename});
        document.body.append(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 10000);
      }
      this.app._toast(t('작업을 저장했습니다.'));
    } catch (error) { this.app._toast(ErrorReporter.text(error)); }
  }
  async load(file) {
    if (!file || this.app.busy || this.app.renameStudio.changing) return;
    try {
      if (file.size > 2 * 1024 * 1024) throw new Error('작업 파일은 2MB까지 열 수 있습니다.');
      const result = await api().project_import(await file.text());
      if (!result?.ok) throw new Error(result?.error || '작업 열기 실패');
      const saved = result.project;
      const steps = saved.steps.map(step => RetimeWorkflow.restore(step, this.app.defaults));
      this.app.intent = groupOf(steps[saved.editing]?.key) || 'video';
      this.app.files = new Files(this.app.waiting); await this.app.files.add(saved.paths);
      this.app.picked.clear(); saved.selected.forEach(path => this.app.picked.tick(path, true, false, []));
      this.app.recipe.steps = steps; this.app.recipe.editing = steps.length ? saved.editing : -1;
      this.app._toolStep(this.app.recipe.current); this.app.done = false; this.app.atHome = false;
      this.app.intent = groupOf(this.app.jobKey) || 'video';
      this.app.renameStudio.invalidate(); this.app.renameStudio.canUndo = false;
      this.app.renameStudio.restoreEditor();
      $('#run').hidden = true; $('#results').replaceChildren(); $('#log').replaceChildren();
      this.app._closeViewer(); this.app._paint();
      this.app._toast(result.missing.length ? `${t('없는 파일')} ${result.missing.length} · ${t('경로를 확인하세요')}` : t('작업을 불러왔습니다. 실행할 준비가 되면 실행을 누르세요.'));
    } catch (error) { this.app._toast(ErrorReporter.text(error)); }
  }
}

/** One preview session owns navigation, metadata, and stale-request protection. */
class PreviewSeek {
  // Browsers quantize seek times. Use the center of a frame, not its boundary.
  static rate(fps) { return Number.isFinite(Number(fps)) && Number(fps)>0 ? Number(fps) : 24; }
  static clamp(time,duration) { return Math.max(0,Math.min(time,Math.max(0,(duration||0)-1e-6))); }
  static start(seconds,fps,duration) { return this.clamp((Number(seconds)||0)+0.5/this.rate(fps),duration); }
  static end(seconds,fps,duration) { return this.clamp((Number(seconds)||0)-0.5/this.rate(fps),duration); }
}

class ResultMedia {
  // A result may list many PNGs before its movie; prefer the final movie.
  static items(data) {
    const candidates=[data.retime?.movie,...(data.nextFiles||[]),...(data.files||[])];
    const movie=/\.(mp4|mov|mkv|webm|avi|m4v|mxf|mpg|mpeg|mts|m2ts)$/i;
    const picture=/\.(png|jpe?g|webp|bmp|tiff?|exr|dpx|gif)$/i;
    const paths=[...new Set(candidates.filter(path=>typeof path==='string' && (movie.test(path)||picture.test(path))))];
    return [...paths.filter(path=>movie.test(path)),...paths.filter(path=>!movie.test(path))].map(path=>({path}));
  }
}
